<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turmas | POCV</title><link rel="stylesheet" href="style.css"><script src="app.js"></script><style>.turma-code{font-weight:900;letter-spacing:.2px}.course-cell{white-space:normal}.turma-table{width:100%;border-collapse:collapse}.turma-table th,.turma-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}.turma-table th{position:sticky;top:0;background:#f8fafc;color:#475569;font-size:12px;z-index:2}</style></head><body><header><h1>Turmas</h1><p>Turmas geradas de acordo com o padrão da oferta acadêmica.</p></header><nav class="mainnav"></nav><main><section class="panel"><div class="controls"><div><label>SEMESTRE</label><select id="s"></select></div><div><label>BUSCA LIVRE</label><input id="q" placeholder="Código, curso ou turno..."></div><div><button id="clear" class="secondary">Limpar</button></div></div></section><section class="card" style="margin-top:16px"><div class="head"><h2>Turmas</h2><span class="count" id="count"></span></div><div class="tablewrap"><table class="turma-table"><thead><tr><th>Turma</th><th>Curso</th><th>Período</th><th>Turno</th><th>Semestre</th></tr></thead><tbody id="b"></tbody></table></div></section></main><script>
let DB=null;const $=id=>document.getElementById(id);function turn(id,p,seq){const r=DB.turn?.[String(id)]?.[String(p)];return r?r[(seq-1)%r.length]:'A definir'}const MATRIX_COURSE_CODES={1:'4206',2:'4206',3:'0000',4:'0000',5:'4407',6:'4407',7:'4407',8:'4111',9:'4111',10:'4411',11:'4411',12:'4506',13:'4506',14:'4510',15:'4510',16:'4069',17:'4069',18:'4069',19:'4103',20:'4103'};function courseCode(cl){return MATRIX_COURSE_CODES[String(cl.matrix)]||'0000'}function turnCode(t){const x=String(t).toLowerCase();return x.includes('manh')?'M':x.includes('tard')||x.includes('vesp')?'V':x.includes('noit')?'N':'X'}function makeCode(cl){return `${cl.period}.${courseCode(cl)}.${cl.seq}${turnCode(turn(cl.matrix,cl.period,cl.seq))}`}
function build(){const sem=$('s').value,q=$('q').value.toLowerCase().trim(),rows=(DB.data.semesters?.[sem]||[]).map(cl=>{const c={name:POCV.courseName(DB.data.courses,cl.matrix)};return{code:makeCode(cl),name:c.name||'',period:cl.period,turn:turn(cl.matrix,cl.period,cl.seq),sem}}).filter(r=>!q||`${r.code} ${r.name} ${r.turn}`.toLowerCase().includes(q));$('count').textContent=`${rows.length} turmas`;$('b').innerHTML=rows.map(r=>`<tr><td class="turma-code">${POCV.esc(r.code)}</td><td class="course-cell">${POCV.tag(r.name,'course')}</td><td>${r.period}º</td><td>${POCV.esc(r.turn)}</td><td>${r.sem}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nenhuma turma encontrada.</td></tr>';POCV.setCourses(rows.map(r=>r.name))}
$('s').onchange=build;$('q').oninput=build;$('clear').onclick=()=>{$('q').value='';build()};(async()=>{DB=await (await fetch('/api/db',{cache:'no-store'})).json();const sems=Object.keys(DB.data.semesters||{});sems.forEach(s=>$('s').add(new Option(s,s)));$('s').value=sems.includes('2027.1')?'2027.1':sems[0];build()})().catch(console.error);
</script></body></html>
