<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard | POCV</title><link rel="stylesheet" href="style.css"><script src="app.js"></script><style>
.dashboard-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.dash-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px #00000008}.dash-card .label{color:var(--muted);font-size:12px;font-weight:700}.dash-card .num{font-size:28px;font-weight:900;margin-top:4px}.dashboard-two{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.dash-list{margin:0;padding:0;list-style:none}.dash-list li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.dash-list li:last-child{border:0}.semester-picker{max-width:220px}.alert-box{padding:12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.ok-box{padding:12px;border-radius:10px;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}@media(max-width:1000px){.dashboard-grid{grid-template-columns:repeat(2,1fr)}.dashboard-two{grid-template-columns:1fr}}@media(max-width:600px){.dashboard-grid{grid-template-columns:1fr}}
</style></head><body><header><h1>Dashboard geral</h1><p>Visão consolidada da oferta acadêmica, docentes, grupos e semestre.</p></header><nav class="mainnav"></nav><main>
<section class="panel" style="margin-bottom:16px"><div style="display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap"><div class="semester-picker"><label>SEMESTRE</label><select id="semester"></select></div><span class="muted" id="updated"></span></div></section>
<section class="dashboard-grid">
<div class="dash-card"><div class="label">TURMAS</div><div class="num" id="nTurmas">0</div></div><div class="dash-card"><div class="label">OFERTAS DISCIPLINARES</div><div class="num" id="nOfertas">0</div></div><div class="dash-card"><div class="label">CARGA-HORÁRIA</div><div class="num" id="ch">0</div><div class="muted">h/a</div></div><div class="dash-card"><div class="label">CURSOS/MATRIZES</div><div class="num" id="nCursos">0</div></div>
<div class="dash-card"><div class="label">DOCENTES</div><div class="num" id="nDocentes">0</div></div><div class="dash-card"><div class="label">EFETIVOS</div><div class="num" id="nEfetivos">0</div></div><div class="dash-card"><div class="label">SUBSTITUTOS</div><div class="num" id="nSubstitutos">0</div></div><div class="dash-card"><div class="label">VISITANTES</div><div class="num" id="nVisitantes">0</div></div>
</section>
<section class="dashboard-two"><div class="card"><div class="head"><h2>Distribuição por grupo</h2><span class="count" id="groupCount"></span></div><div style="padding:0 16px"><ul class="dash-list" id="groups"></ul></div></div><div class="card"><div class="head"><h2>Situação dos docentes</h2></div><div style="padding:16px"><div id="situation"></div></div></div></section>
</main><script>
let DB=null;const $=id=>document.getElementById(id);const esc=v=>POCV.esc(v);function turn(id,p,seq){const r=DB.turn?.[String(id)]?.[String(p)];return r?r[(seq-1)%r.length]:'A definir'}
function courseCode(cl){const n=String((DB.data.courses?.[String(cl.matrix)]||{}).name||'');const m=String(cl.matrix);if(m==='20'||m==='19')return'4103';if(['16','17','18'].includes(m))return'4069';if(['12','13','14','15'].includes(m))return n.includes('EJA')?'4510':'4506';if(['5','6','7'].includes(m))return'4407';if(['1','2'].includes(m))return'4206';if(['8','9'].includes(m))return'4111';if(['10','11'].includes(m))return'4411';return'0000'}
function turnCode(t){const x=String(t).toLowerCase();return x.includes('manh')?'M':x.includes('tard')||x.includes('vesp')?'V':x.includes('noit')?'N':'X'}
function makeTurmaCode(cl){return `${cl.period}.${courseCode(cl)}.${cl.seq}${turnCode(turn(cl.matrix,cl.period,cl.seq))}`}
function rowsFor(sem){let rows=[];(DB.data.semesters?.[sem]||[]).forEach(cl=>{const c=DB.data.courses?.[String(cl.matrix)]||{};const m=DB.data.matrices?.[String(cl.matrix)]||{};(m.disciplines||[]).forEach((d,di)=>{const ch=d.periods?.[String(cl.period)];if(ch==null)return;const key=`${cl.matrix}|${cl.period}|${cl.seq}|${di}`,ov=DB.offers?.[sem]?.[key]||{};rows.push({key,matrix:cl.matrix,course:ov.course??c.name,group:ov.group??d.group??'',ch:Number(ov.ch??ch),turma:ov.turma??makeTurmaCode(cl)})})});return rows}
function build(){const sem=$('semester').value,rows=rowsFor(sem),teachers=DB.teachers||[];$('nTurmas').textContent=(DB.data.semesters?.[sem]||[]).length;$('nOfertas').textContent=rows.length;$('ch').textContent=rows.reduce((s,r)=>s+r.ch,0).toLocaleString('pt-BR');$('nCursos').textContent=new Set(rows.map(r=>r.matrix)).size;$('nDocentes').textContent=teachers.length;$('nEfetivos').textContent=teachers.filter(t=>t.vinculo==='Efetivo').length;$('nSubstitutos').textContent=teachers.filter(t=>/substit/i.test(t.vinculo||'')).length;$('nVisitantes').textContent=teachers.filter(t=>/visitante/i.test(t.vinculo||'')).length;const gd={};rows.forEach(r=>{if(r.group){gd[r.group]=(gd[r.group]||0)+r.ch}});POCV.setGroups(Object.keys(gd));$('groupCount').textContent=`${Object.keys(gd).length} grupos com oferta`;$('groups').innerHTML=Object.entries(gd).sort((a,b)=>b[1]-a[1]).map(([g,v])=>`<li><span>${POCV.tag(g,'group')}</span><b>${v.toLocaleString('pt-BR')} h/a</b></li>`).join('')||'<li>Nenhum grupo com oferta.</li>';const regular=teachers.filter(t=>(t.leave||'Não se aplica')==='Não se aplica'&&(t.management||'Não se aplica')==='Não se aplica').length;const restricted=teachers.length-regular;$('situation').innerHTML=restricted?`<div class="alert-box"><b>${restricted}</b> docente(s) com afastamento, cessão, capacitação ou gestão registrada.</div>`:'<div class="ok-box">Todos os docentes estão sem restrições registradas.</div>';}
(async()=>{DB=await (await fetch('/api/db',{cache:'no-store'})).json();const sems=Object.keys(DB.data.semesters||{});sems.forEach(s=>document.getElementById('semester').add(new Option(s,s)));$('semester').value=sems.includes('2027.1')?'2027.1':sems[sems.length-1];$('semester').onchange=build;build();$('updated').textContent='Banco local carregado agora.'})().catch(e=>console.error(e));
</script></body></html>
