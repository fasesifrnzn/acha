<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Docentes | Projeção de Ofertas IFRN</title>
  <style>
    :root{--bg:#f5f7fa;--card:#fff;--ink:#17202a;--muted:#64748b;--line:#e2e8f0;--accent:#0f766e;--nav:#0f172a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial}header{background:var(--nav);color:#fff;padding:22px 28px}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#cbd5e1}.mainnav{max-width:1500px;margin:14px auto;padding:0 18px;display:flex;gap:8px;flex-wrap:wrap}.mainnav a{padding:9px 13px;border-radius:9px;background:#e2e8f0;color:#334155;text-decoration:none;font-weight:700}.mainnav a:hover,.mainnav a.active{background:var(--accent);color:#fff}main{max-width:1500px;margin:22px auto;padding:0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.filters{display:flex;gap:9px;flex-wrap:wrap;flex:1}input,select{padding:9px 10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:var(--ink);font:inherit}input{min-width:240px;flex:1}.total{font-weight:700;color:var(--muted);white-space:nowrap}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;background:#f8fafc;color:#475569;font-size:12px;white-space:nowrap;z-index:2;cursor:grab}th button.sort{width:100%;border:0;border-radius:0;background:transparent;color:#334155;text-align:left;padding:10px;font-weight:800;cursor:grab}th button.sort:hover{background:#e2e8f0;color:#0f172a}td{max-width:0}.teacher{font-weight:700}.secondary{display:block;margin-top:2px;color:var(--muted);font-size:12px}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#e2e8f0;color:#334155;font-size:12px;font-weight:700;white-space:nowrap}.warning{background:#fef3c7;color:#92400e}.empty{padding:34px;text-align:center;color:var(--muted)}@media(max-width:850px){.table-wrap{overflow:auto}table{min-width:980px}header{padding:20px}.mainnav,main{padding:0 12px}}
  
.actions-cell{width:92px;text-align:center!important;overflow:visible}
.row-actions{display:flex;gap:5px;justify-content:center;align-items:center}
.icon-btn{width:30px;height:30px;padding:0!important;border:1px solid var(--line);background:#fff!important;color:#334155!important;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer}
.icon-btn:hover{background:#f0fdfa!important;color:#0f766e!important}
.icon-btn.delete:hover{background:#fef2f2!important;color:#b91c1c!important}
th[data-col="actions"]{width:92px;cursor:default}
.drag-over{box-shadow:inset 3px 0 0 var(--accent)}
/* Identidade visual compartilhada para grupos/cursos. */
.tag{display:inline-flex;align-items:center;max-width:100%;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent}
.tag-0{background:#e0f2fe;color:#075985;border-color:#bae6fd}.tag-1{background:#dcfce7;color:#166534;border-color:#bbf7d0}.tag-2{background:#fef3c7;color:#92400e;border-color:#fde68a}.tag-3{background:#fce7f3;color:#9d174d;border-color:#fbcfe8}.tag-4{background:#ede9fe;color:#5b21b6;border-color:#ddd6fe}.tag-5{background:#cffafe;color:#155e75;border-color:#a5f3fc}.tag-6{background:#ffedd5;color:#9a3412;border-color:#fed7aa}.tag-7{background:#f3e8ff;color:#7e22ce;border-color:#e9d5ff}.tag-8{background:#ecfccb;color:#3f6212;border-color:#d9f99d}.tag-9{background:#e2e8f0;color:#334155;border-color:#cbd5e1}
</style>
<script src="app.js"></script><link rel="stylesheet" href="style.css"></head>
<body>
  <header><h1>Docentes</h1><p>Relação de docentes utilizada na projeção de ofertas.</p></header>
  <nav class="mainnav"><a href="index.html">📋 Oferta</a><a href="projecao.html">📊 Projeção por turno</a><a href="matrizes.html">🎓 Matrizes</a><a href="turmas.html">👥 Turmas</a><a href="docentes.html" class="active">👩‍🏫 Docentes</a><a href="grupos.html">🏷️ Grupos</a><a href="regras.html">⚙️ Regras</a></nav>
  <main><section class="card"><div class="head"><div class="filters"><input id="search" type="search" placeholder="Pesquisar por nome ou disciplina" aria-label="Pesquisar docentes"><select id="group"><option value="">Todos os grupos</option></select><select id="vinculo"><option value="">Todos os vínculos</option></select><select id="situation"><option value="">Todas as situações</option><option value="disponivel">Sem afastamento ou gestão</option><option value="restricao">Com afastamento ou gestão</option></select></div><span class="total" id="total">Carregando…</span></div><div class="table-wrap"><table><thead><tr><th draggable="true" data-col="name" style="width:20%"><button type="button" class="sort" data-sort="name">Docente ↕</button></th><th draggable="true" data-col="discipline" style="width:22%"><button type="button" class="sort" data-sort="discipline">Disciplina / área ↕</button></th><th draggable="true" data-col="group" style="width:12%"><button type="button" class="sort" data-sort="group">Grupo ↕</button></th><th draggable="true" data-col="degree" style="width:10%"><button type="button" class="sort" data-sort="degree">Titulação ↕</button></th><th draggable="true" data-col="vinculo" style="width:9%"><button type="button" class="sort" data-sort="vinculo">Vínculo ↕</button></th><th draggable="true" data-col="regime" style="width:10%"><button type="button" class="sort" data-sort="regime">Regime ↕</button></th><th draggable="true" data-col="situation" style="width:17%"><button type="button" class="sort" data-sort="situation">Situação ↕</button></th><th data-col="actions" class="actions-head" style="width:92px">Ações</th></tr></thead><tbody id="teachers"></tbody></table></div></section></main>
  <script>
    const $=id=>document.getElementById(id), teachersBody=$('teachers'); let teachers=[];
    const norm=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const unique=(items,key)=>[...new Set(items.map(key).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
    const escapeHtml=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const restricted=t=>(t.leave&&t.leave!=='Não se aplica')||(t.management&&t.management!=='Não se aplica');
    function situation(t){const details=[];if(t.leave&&t.leave!=='Não se aplica')details.push(t.leave);if(t.management&&t.management!=='Não se aplica')details.push(t.management);return details.length?details.join(' · '):'Disponível'}
    function optionList(element,items){element.insertAdjacentHTML('beforeend',items.map(value=>`<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join(''))}
    function render(){const query=norm($('search').value),group=$('group').value,vinculo=$('vinculo').value,situationFilter=$('situation').value;const rows=teachers.filter(t=>{const matchesText=!query||norm([t.name,t.discipline,t.group,t.degree,t.vinculo].join(' ')).includes(query);const matchesSituation=!situationFilter||(situationFilter==='restricao'===restricted(t));return matchesText&&(!group||t.group===group)&&(!vinculo||t.vinculo===vinculo)&&matchesSituation}).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR'));$('total').textContent=`${rows.length} docente${rows.length===1?'':'s'}`;teachersBody.innerHTML=rows.length?rows.map(t=>`<tr><td><span class="teacher">${escapeHtml(t.name)}</span></td><td>${escapeHtml(t.discipline||'—')}</td><td><span class="badge">${escapeHtml(t.group||'—')}</span></td><td>${escapeHtml(t.degree||'—')}</td><td>${escapeHtml(t.vinculo||'—')}</td><td>${escapeHtml(t.regime||'—')}<span class="secondary">${Math.round((Number(t.regimePct)||0)*100)}% do regime</span></td><td><span class="badge ${restricted(t)?'warning':''}">${escapeHtml(situation(t))}</span><span class="secondary">Fator de aula: ${Math.round((Number(t.classFactor)||0)*100)}%</span></td></tr>`).join(''):'<tr><td class="empty" colspan="7">Nenhum docente encontrado com estes filtros.</td></tr>'}
    async function load(){try{const response=await fetch('/api/db');if(!response.ok)throw new Error('Não foi possível carregar os docentes.');const db=await response.json();teachers=Array.isArray(db.teachers)?db.teachers:[];optionList($('group'),unique(teachers,t=>t.group));optionList($('vinculo'),unique(teachers,t=>t.vinculo));render()}catch(error){$('total').textContent='Erro ao carregar';teachersBody.innerHTML=`<tr><td class="empty" colspan="7">${escapeHtml(error.message)}</td></tr>`}}
    ['search','group','vinculo','situation'].forEach(id=>$(id).addEventListener('input',render));load();
  </script>
<script src="docentes-editor.js"></script></body>
</html>
