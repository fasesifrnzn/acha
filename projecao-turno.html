<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACHA — Projeção por turno</title><link rel="stylesheet" href="/style.css?v=1.0.0"><script src="/app.js?v=1.0.0"></script><style>
.t-page{max-width:1500px}.controls{grid-template-columns:170px 1fr auto}.turn-grid{display:grid;grid-template-columns:205px repeat(3,minmax(180px,1fr));min-width:760px}.turn-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}.headc{height:38px;background:#f8fafc;padding:8px;text-align:center;font-size:10px;font-weight:900}.headc:first-child{text-align:left}.groupc{height:52px;padding:7px;display:flex;align-items:center;gap:6px;background:#fff}.group-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:999px;border:1px solid var(--tag-border);background:var(--tag-bg);color:var(--tag-fg);font-weight:900;cursor:pointer;max-width:100%}.group-chip .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.group-chip .i{font-size:8px}.turnc{height:52px;padding:5px 7px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}.turnc .left strong{display:block;font-size:12px}.turnc .left small{font-size:8px;color:#64748b}.turnc .state{font-size:8px;font-weight:900;padding:3px 6px;border-radius:999px;white-space:nowrap}.turnc.ok .state{background:#ecfdf5;color:#047857}.turnc.warn .state{background:#fffbeb;color:#b45309}.turnc.low .state{background:#fff7ed;color:#c2410c}.turnc.bad .state{background:#fef2f2;color:#b91c1c}.turnc.empty{cursor:default}.turnc.empty .left strong{color:#cbd5e1}.turnc.empty .state{background:#f8fafc;color:#94a3b8}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.kpi small{font-size:9px;color:#64748b}.kpi strong{display:block;font-size:19px}.modal-back{position:fixed;inset:0;background:#0f172a66;display:none;align-items:center;justify-content:center;z-index:3000;padding:18px}.modal-back.open{display:flex}.modal{width:min(780px,95vw);max-height:84vh;overflow:auto;background:#fff;border-radius:14px;padding:16px}.detail{width:100%;border-collapse:collapse;font-size:10px}.detail th,.detail td{padding:6px;border-bottom:1px solid var(--line);text-align:left}.detail th{background:#f8fafc;color:#64748b}.teachers{display:flex;flex-direction:column;gap:5px}.teacher{display:flex;justify-content:space-between;padding:7px 8px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;font-size:10px}@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
</style></head><body><header><h1>ACHA — Projeção por turno</h1><p>Distribuição da carga horária docente por grupo e turno no semestre selecionado.</p></header><nav class="mainnav"></nav><main class="t-page"><section class="panel"><div class="controls"><div><label>SEMESTRE</label><select id="sem"></select></div><div><label>BUSCA LIVRE</label><input id="q" placeholder="Grupo ou turno..."></div><button id="refresh">Atualizar</button></div></section><section class="kpis" id="kpis"></section><section class="card" style="padding:12px"><div class="head" style="padding:0 0 9px;border:0"><h2>Projeção por turno</h2><span class="muted" id="count"></span></div><div class="turn-wrap"><div class="turn-grid" id="grid"></div></div></section></main><div class="modal-back" id="mb"><div class="modal"><button class="secondary" id="close" style="float:right">Fechar</button><div id="body"></div></div></div><script>
let DB=null;const $=id=>document.getElementById(id),esc=v=>POCV.esc(v),fmt=v=>Math.round(Number(v)||0).toLocaleString('pt-BR'),fmt1=v=>Number(v||0).toLocaleString('pt-BR',{maximumFractionDigits:1}),gkey=v=>POCV.groupKey(v);function teachers(g){return(DB.teachers||[]).filter(t=>gkey(t.group)===gkey(g))}function idx(g){return teachers(g).reduce((s,t)=>s+Number(t.classFactor||0),0)}function limits(g){let min=0,max=0;teachers(g).forEach(t=>{const f=Number(t.classFactor||0),r=String(t.regime||'').toUpperCase(),b=/20\s*(H|HORAS?)/.test(r)?[8,12]:[10,20];min+=b[0]*f;max+=b[1]*f});return{min,max}}function state(g,total){if(!total)return['empty','Sem carga'];const l=limits(g),c=total*.75;if(!idx(g))return['bad','Déficit'];if(c>l.max)return['bad','Déficit'];if(c<l.min)return['low','Abaixo do mínimo'];if(c>=l.max*.9)return['warn','Limite'];return['ok','OK']}
function turn(id,p,seq){const r=DB.turn?.[String(id)]?.[String(p)];return r?r[(seq-1)%r.length]:'A definir'}function rows(s){let a=[];(DB.data.semesters?.[s]||[]).forEach(cl=>{const m=DB.data.matrices?.[String(cl.matrix)]||{},c=POCV.courseName(DB.data.courses,cl.matrix);(m.disciplines||[]).forEach((d,di)=>{const baseCh=d.periods?.[String(cl.period)];if(baseCh==null)return;const key=`${cl.matrix}|${cl.period}|${cl.seq}|${di}`,ov=DB.offers?.[s]?.[key]||{};const catalog=Array.isArray(m.optionalCatalog)?m.optionalCatalog:[];const choices=Array.isArray(ov.optionalChoices)?ov.optionalChoices:(ov.optionalChoice?[ov.optionalChoice]:[]);const selected=choices.map(n=>catalog.find(o=>String(o?.name||'')===String(n))).filter(Boolean);if(d.optional===true&&selected.length){selected.forEach(o=>a.push({discipline:o.name,course:ov.course||c,ch:Number(o.weekly||0),group:o.group||d.group||'',turn:ov.turn||turn(cl.matrix,cl.period,cl.seq),period:cl.period}));return;}const ch=Number(ov.ch??baseCh),group=String(ov.group??d.group??'').trim();if(!Number.isFinite(ch)||!group)return;a.push({discipline:ov.name||d.name,course:ov.course||c,ch,group,turn:ov.turn||turn(cl.matrix,cl.period,cl.seq),period:cl.period})})});extraRowsFor(s).forEach(r=>{if(r.group&&r.ch>0)a.push(r)});return a}
function extraRowsFor(s){return (DB?.extraOffers?.[s]||[]).map(x=>({discipline:x.name,course:x.course||'Demanda avulsa',ch:Number(x.ch||0),group:String(x.group||'').trim(),turn:x.turn||'A definir',period:0}))}
function canonical(g){const k=gkey(g),vals=[...(DB.teachers||[]).map(t=>t.group),...Object.keys(DB.meta||{})];return vals.find(v=>gkey(v)===k)||g}function tag(g){const c=POCV.color(canonical(g),'group');return `<span class="group-chip" data-group="${esc(g)}" style="--tag-bg:${c.bg};--tag-fg:${c.fg};--tag-border:${c.border}"><span class="n">${esc(canonical(g))}</span><span class="i">${fmt1(idx(g))}</span></span>`}function modal(t,s,b){$('body').innerHTML=`<h3>${esc(t)}</h3><p class="muted" style="font-size:10px">${esc(s)}</p>${b}`;$('mb').classList.add('open')}
function build(){const s=$('sem').value,q=$('q').value.toLowerCase().trim(),rs=rows(s),turns=['Matutino','Tarde','Noite'],groups=[...new Set(rs.map(r=>gkey(r.group)))].map(k=>canonical(k)).filter(g=>!q||`${g} ${turns.join(' ')}`.toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b,'pt-BR'));const agg={};rs.forEach(r=>{const k=gkey(r.group);agg[k]??={};agg[k][r.turn]=(agg[k][r.turn]||0)+r.ch});let html='<div class="cell headc">GRUPO / ÍNDICE</div>'+turns.map(t=>`<div class="cell headc">${t}</div>`).join('');groups.forEach(g=>{const k=gkey(g);html+=`<div class="cell groupc">${tag(g)}</div>`;turns.forEach(t=>{const total=Number(agg[k]?.[t]||0),st=state(g,total),av=idx(g)?total/idx(g):total;const det=encodeURIComponent(JSON.stringify(rs.filter(r=>gkey(r.group)===k&&r.turn===t)));html+=`<div class="cell turnc ${st[0]}" data-d="${det}"><div class="left"><strong>${total?fmt1(av):'0'} h/a</strong><small>${fmt(total)} h/a total</small></div><span class="state">${st[1]}</span></div>`})});$('grid').style.setProperty('--cols',4);$('grid').innerHTML=html;$('count').textContent=`${rs.length} ofertas`;const total=rs.reduce((s,r)=>s+r.ch,0),by={};rs.forEach(r=>by[r.turn]=(by[r.turn]||0)+r.ch);$('kpis').innerHTML=`<div class="kpi"><small>CH TOTAL</small><strong>${fmt(total)} h/a</strong><small>${fmt(total*.75)} h-relógio</small></div><div class="kpi"><small>MATUTINO</small><strong>${fmt(by['Matutino']||0)} h/a</strong></div><div class="kpi"><small>TARDE</small><strong>${fmt(by['Tarde']||0)} h/a</strong></div><div class="kpi"><small>NOITE</small><strong>${fmt(by['Noite']||0)} h/a</strong></div>`;bind()}
function bind(){$('grid').querySelectorAll('[data-d]').forEach(el=>el.onclick=()=>{const rs=JSON.parse(decodeURIComponent(el.dataset.d));const body=rs.length?`<table class="detail"><thead><tr><th>Disciplina</th><th>Curso</th><th>Período</th><th>CH</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.discipline)}</td><td>${esc(r.course)}</td><td>${r.period}º</td><td>${fmt(r.ch)} h/a</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Sem disciplinas neste turno.</p>';modal('Detalhamento da carga','Disciplinas que compõem a célula selecionada',body)});$('grid').querySelectorAll('[data-group]').forEach(el=>el.onclick=e=>{e.stopPropagation();const ts=teachers(el.dataset.group);modal(canonical(el.dataset.group),'Docentes do grupo',ts.length?`<div class="teachers">${ts.map(t=>`<div class="teacher"><span>${esc(t.name)}</span><strong>${fmt1(t.classFactor)} prof.</strong></div>`).join('')}</div>`:'<p class="muted">Nenhum docente cadastrado.</p>')})}
async function load(){DB=await(await fetch('/api/db',{cache:'no-store'})).json();$('sem').innerHTML='';Object.keys(DB.data.semesters||{}).forEach(s=>$('sem').add(new Option(s,s)));$('sem').value=DB.data.semesters['2027.1']?'2027.1':$('sem').options[0]?.value||'';build()}$('sem').onchange=build;$('q').oninput=build;$('refresh').onclick=load;$('close').onclick=()=>$('mb').classList.remove('open');$('mb').onclick=e=>{if(e.target.id==='mb')e.target.classList.remove('open')};load().catch(e=>alert('Não foi possível carregar a projeção por turno: '+e.message));
</script></body></html>
