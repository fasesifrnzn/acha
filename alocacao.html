<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alocação docente | ACHA</title><link rel="stylesheet" href="/style.css?v=1.0.0"><script src="/app.js?v=1.0.0"></script><style>
.alloc-table{width:100%;border-collapse:collapse;table-layout:fixed}.alloc-table th,.alloc-table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.alloc-table th{position:sticky;top:0;background:#f8fafc;color:#475569;font-size:12px;z-index:2}.alloc-table select{width:100%;padding:7px;border:1px solid #cbd5e1;border-radius:8px}.status{font-size:12px;color:var(--muted)}.allocated{background:#f0fdf4}.unallocated{background:#fff7ed}
</style></head><body><header><h1>Alocação docente</h1><p>Associe cada disciplina ofertada a um professor do grupo ao qual ela pertence.</p></header><nav class="mainnav"></nav><main>
<section class="panel"><div class="controls"><div><label>SEMESTRE</label><select id="semester"></select></div><div><label>BUSCA LIVRE</label><input id="q" placeholder="Disciplina, curso, grupo ou turma..."></div><div><button id="clear" class="secondary">Limpar</button></div></div><div class="filtergrid"><div><label>GRUPO</label><select id="group"><option value="">Todos</option></select></div><div><label>CURSO</label><select id="course"><option value="">Todos</option></select></div><div><label>STATUS</label><select id="status"><option value="">Todos</option><option value="ok">Alocado</option><option value="pending">Sem professor</option></select></div></div></section>
<section class="card" style="margin-top:16px"><div class="head"><h2 id="title">Alocação de disciplinas</h2><span class="status" id="state"></span></div><div class="tablewrap"><table class="alloc-table"><thead><tr><th style="width:13%">Turma</th><th style="width:22%">Curso</th><th style="width:23%">Disciplina</th><th style="width:14%">Grupo</th><th style="width:8%">CH</th><th>Professor</th></tr></thead><tbody id="body"></tbody></table></div><div id="empty" class="empty" style="display:none">Nenhuma oferta encontrada.</div></section>
</main><script>
let DB=null,rows=[];const $=id=>document.getElementById(id);const esc=v=>POCV.esc(v);function turn(id,p,seq){const r=DB.turn?.[String(id)]?.[String(p)];return r?r[(seq-1)%r.length]:'A definir'}function courseCode(cl){const n=POCV.courseName(DB.data.courses,cl.matrix),m=String(cl.matrix);if(m==='20'||m==='19')return'4103';if(['16','17','18'].includes(m))return'4069';if(['12','13','14','15'].includes(m))return n.includes('EJA')?'4510':'4506';if(['5','6','7'].includes(m))return'4407';if(['1','2'].includes(m))return'4206';if(['8','9'].includes(m))return'4111';if(['10','11'].includes(m))return'4411';return'0000'}function turnCode(t){const x=String(t).toLowerCase();return x.includes('manh')?'M':x.includes('tard')||x.includes('vesp')?'V':x.includes('noit')?'N':'X'}function turma(cl){return `${cl.period}.${courseCode(cl)}.${cl.seq}${turnCode(turn(cl.matrix,cl.period,cl.seq))}`}
function allRows(){let out=[];const sem=$('semester').value;(DB.data.semesters?.[sem]||[]).forEach(cl=>{const c={name:POCV.courseName(DB.data.courses,cl.matrix)},m=DB.data.matrices?.[String(cl.matrix)]||{};(m.disciplines||[]).forEach((d,di)=>{const ch=d.periods?.[String(cl.period)];if(ch==null)return;const key=`${cl.matrix}|${cl.period}|${cl.seq}|${di}`,ov=DB.offers?.[sem]?.[key]||{};out.push({_key:key,turma:ov.turma??turma(cl),course:ov.course??c.name,name:ov.name??d.name,group:String(ov.group??d.group??'').trim(),ch:Number(ov.ch??ch),teacherId:ov.teacherId??''})})});return out}
function fill(id,vals,label='Todos'){const s=$(id),old=s.value;s.innerHTML=`<option value="">${label}</option>`;[...new Set(vals.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR',{sensitivity:'base'})).forEach(v=>s.add(new Option(v,v)));if([...s.options].some(o=>o.value===old))s.value=old}
function teachersFor(group){return (DB.teachers||[]).filter(t=>String(t.group||'').trim()===group).sort((a,b)=>String(a.name).localeCompare(String(b.name),'pt-BR',{sensitivity:'base'}))}
function build(){rows=allRows();fill('group',rows.map(r=>r.group));fill('course',rows.map(r=>r.course));const q=$('q').value.toLowerCase().trim(),g=$('group').value,c=$('course').value,st=$('status').value;const filtered=rows.filter(r=>(!q||`${r.turma} ${r.course} ${r.name} ${r.group}`.toLowerCase().includes(q))&&(!g||r.group===g)&&(!c||r.course===c)&&(!st||(st==='ok'?r.teacherId:!r.teacherId)));POCV.setGroups(rows.map(r=>r.group));$('title').textContent=`Alocação — ${$('semester').value}`;$('body').innerHTML=filtered.map((r,i)=>{const ts=teachersFor(r.group),selected=ts.find(t=>String(t.id)===String(r.teacherId));return `<tr class="${selected?'allocated':'unallocated'}" data-key="${esc(r._key)}"><td>${esc(r.turma)}</td><td>${POCV.tag(r.course,'course')}</td><td>${esc(r.name)}</td><td>${r.group?POCV.tag(r.group,'group'):'<span class="muted">—</span>'}</td><td>${r.ch}</td><td>${r.group?`<select class="teacher-select"><option value="">— Selecionar professor —</option>${ts.map(t=>`<option value="${t.id}" ${String(t.id)===String(r.teacherId)?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`:'<span class="muted">Defina o grupo antes de alocar.</span>'}</td></tr>`}).join('');$('empty').style.display=filtered.length?'none':'block'}
async function save(key,teacherId,tr){const state=$('state');state.textContent='Salvando…';try{const r=await fetch('/api/offer',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({semester:$('semester').value,key,changes:{teacherId:teacherId?Number(teacherId):null}})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`Servidor respondeu ${r.status}`);DB=await (await fetch('/api/db',{cache:'no-store'})).json();state.textContent='Salvo automaticamente';build();setTimeout(()=>{if(state.textContent==='Salvo automaticamente')state.textContent=''},1200)}catch(e){state.textContent='Erro';alert('Não foi possível salvar: '+e.message);build()}}
$('semester').onchange=build;$('q').oninput=build;$('group').onchange=build;$('course').onchange=build;$('status').onchange=build;$('clear').onclick=()=>{$('q').value='';$('group').value='';$('course').value='';$('status').value='';build()};$('body').addEventListener('change',e=>{const s=e.target.closest('.teacher-select');if(!s)return;save(s.closest('tr').dataset.key,s.value,s.closest('tr'))});
(async()=>{DB=await (await fetch('/api/db',{cache:'no-store'})).json();Object.keys(DB.data.semesters||{}).forEach(s=>$('semester').add(new Option(s,s)));$('semester').value=Object.keys(DB.data.semesters||{}).includes('2027.1')?'2027.1':Object.keys(DB.data.semesters||{})[0];build()})().catch(e=>console.error(e));
</script></body></html>
