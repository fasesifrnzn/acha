<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACHA — Demandas avulsas</title><link rel="stylesheet" href="/style.css?v=1.0.153"><script src="/app.js?v=1.0.153"></script><style>.demand-form{display:grid;grid-template-columns:1.6fr .7fr 1fr 1fr 1fr;gap:12px;align-items:end}.demand-form .wide{grid-column:span 2}.demand-table th,.demand-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}.demand-table{width:100%;border-collapse:collapse}.demand-table th{background:#f8fafc;color:#475569;font-size:12px}.demand-badge{display:inline-flex;padding:4px 8px;border-radius:8px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-weight:800;font-size:11px}@media(max-width:1000px){.demand-form{grid-template-columns:1fr 1fr}.demand-form .wide{grid-column:auto}}</style></head><body><header><h1>Demandas avulsas</h1><p>Disciplinas de demandas reprimidas, dependências e outras ofertas excepcionais por semestre.</p></header><nav class="mainnav"></nav><main>
<section class="panel"><div class="demand-form"><div><label>SEMESTRE</label><select id="semester"></select></div><div><label>CH (h/a)</label><input id="ch" type="number" min="0" step="1" value="60"></div><div><label>TIPO</label><select id="type"><option>Dependência</option><option>Demanda reprimida</option><option>Outro</option></select></div><div><label>GRUPO</label><select id="group"><option value="">—</option></select></div><div><label>TURNO</label><select id="turn"><option value="">A definir</option><option>Matutino</option><option>Vespertino</option><option>Noturno</option></select></div><div class="wide"><label>DISCIPLINA / DEMANDA</label><input id="name" placeholder="Nome da disciplina que precisa ser ofertada"></div><div id="courseWrap"><label>CURSO / CONTEXTO</label><select id="course"><option value="">— Selecione o curso —</option></select></div><div class="wide"><label>OBSERVAÇÕES</label><input id="notes" placeholder="Informações adicionais"></div><div><button id="add">Solicitar demanda avulsa</button></div></div></section>
<section class="card" style="margin-top:16px"><div class="head"><div><h2 style="margin:0;font-size:16px">Demandas do semestre</h2><span class="count" id="count"></span></div><div><label>STATUS DE VALIDAÇÃO</label><select id="validationStatus"><option value="">Todos</option><option value="pending">Solicitadas</option><option value="approved">Aprovadas</option><option value="correction_requested">Solicitada correção</option></select></div></div><div class="tablewrap"><table class="demand-table"><thead><tr><th>Tipo</th><th>Disciplina</th><th>Curso/contexto</th><th>Grupo</th><th>CH</th><th>Turno</th><th>Observações</th><th>Status de validação</th></tr></thead><tbody id="body"></tbody></table></div></section></main>
<script>let DB=null,SESSION=null,APPROVALS=[];const $=id=>document.getElementById(id),esc=v=>POCV.esc(v);function offeredCourses(semester){const ids=[...new Set((DB?.data?.semesters?.[semester]||[]).map(c=>String(c.matrix)))];const cs=Array.isArray(DB?.data?.courses)?DB.data.courses:[];const seen=new Map();ids.forEach(mid=>{const c=cs.find(x=>String(x.matrix)===mid);if(!c)return;const id=String(c.course_id||c.course_name||c.name||mid);if(!seen.has(id))seen.set(id,{id,label:String(c.course_name||c.name||id),form:String(c.form||'')});});return [...seen.values()].sort((a,b)=>a.label.localeCompare(b.label,'pt-BR'));}function refreshCourse(){const type=$('type').value,wrap=$('courseWrap'),sel=$('course');const req=type!=='Dependência';wrap.style.display=req?'':'none';sel.innerHTML='<option value="">— Selecione o curso —</option>'+offeredCourses($('semester').value).map(v=>'<option value="'+esc(v.id)+'">'+esc(v.label)+(v.form?' — '+esc(v.form):'')+'</option>').join('');sel.required=req;}
function groups(){const gs=[];Object.values(DB?.data?.matrices||{}).forEach(m=>(m?.disciplines||[]).forEach(d=>{if(d?.group)gs.push(d.group)}));return [...new Set(gs)].sort((a,b)=>a.localeCompare(b,'pt-BR'))}function labelStatus(s){return s==='pending'?'Solicitada':s==='approved'?'Aprovada':'Solicitada correção'}function load(){const sems=Object.keys(DB.data.semesters||{});sems.forEach(s=>$('semester').add(new Option(s,s)));$('semester').value=sems.includes('2027.1')?'2027.1':sems[0]||'';groups().forEach(g=>$('group').add(new Option(g,g)));refreshCourse();build()}function build(){const sem=$('semester').value,st=$('validationStatus').value,arr=(DB.extraOffers?.[sem]||[]).map(x=>{const a=APPROVALS.filter(v=>v.semester===sem&&String(v.targetId)===String(x.id)).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)))[0];return {...x,_validation:a?.status||x.validationStatus||'approved'}});const pendingCreates=APPROVALS.filter(a=>a.semester===sem&&a.type==='extra_create'&&a.status!=='approved').map(a=>({...a.proposed,id:'pending-'+a.id,_validation:a.status,_pending:true}));const rows=[...arr,...pendingCreates].filter(x=>!st||x._validation===st);$('count').textContent=`${rows.length} demandas`;$('body').innerHTML=rows.map(x=>`<tr><td><span class="demand-badge">${esc(x.type||'Demanda')}</span></td><td>${esc(x.name)}</td><td>${esc(x.course||'—')}</td><td>${x.group?POCV.tag(x.group,'group'):'—'}</td><td>${Number(x.ch||0)} h/a</td><td>${esc(x.turn||'A definir')}</td><td>${esc(x.notes||'—')}</td><td><span class="demand-badge">${labelStatus(x._validation)}</span></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhuma demanda encontrada.</td></tr>'}async function refresh(){DB=await (await fetch('/api/db',{cache:'no-store'})).json();const r=await fetch('/api/validation',{cache:'no-store'});APPROVALS=r.ok?(await r.json()).approvals||[]:[];build()}$('semester').onchange=()=>{refreshCourse();build()};$('type').onchange=refreshCourse;$('validationStatus').onchange=build;$('add').onclick=async()=>{const name=$('name').value.trim(),sem=$('semester').value;if(!name){alert('Informe a disciplina/demanda.');return}const type=$('type').value,course=type==='Dependência'?'':$('course').value;if(type!=='Dependência'&&!course){alert('Selecione o curso.');$('course').focus();return}const payload={semester:sem,name,ch:Number($('ch').value)||0,type,group:$('group').value,turn:$('turn').value,course,notes:$('notes').value};const r=await fetch('/api/validation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'extra',action:'create',semester:sem,proposed:payload})});const d=await r.json();if(!r.ok){alert(d.error||'Não foi possível solicitar.');return}alert('Demanda enviada para aprovação da Direção.');$('name').value='';$('notes').value='';refresh()};(async()=>{SESSION=await (await fetch('/api/session',{cache:'no-store'})).json();DB=await (await fetch('/api/db',{cache:'no-store'})).json();load();refresh()})().catch(()=>{});</script></body></html>
