<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demandas avulsas | POCV</title><link rel="stylesheet" href="style.css"><script src="app.js"></script><style>.demand-form{display:grid;grid-template-columns:1.6fr .7fr 1fr 1fr 1fr;gap:12px;align-items:end}.demand-form .wide{grid-column:span 2}.demand-table th,.demand-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}.demand-table{width:100%;border-collapse:collapse}.demand-table th{background:#f8fafc;color:#475569;font-size:12px}.demand-badge{display:inline-flex;padding:4px 8px;border-radius:8px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-weight:800;font-size:11px}@media(max-width:1000px){.demand-form{grid-template-columns:1fr 1fr}.demand-form .wide{grid-column:auto}}</style></head><body><header><h1>Demandas avulsas</h1><p>Disciplinas de demandas reprimidas, dependências e outras ofertas excepcionais por semestre.</p></header><nav class="mainnav"></nav><main>
<section class="panel"><div class="demand-form"><div><label>SEMESTRE</label><select id="semester"></select></div><div><label>CH (h/a)</label><input id="ch" type="number" min="0" step="1" value="60"></div><div><label>TIPO</label><select id="type"><option>Dependência</option><option>Demanda reprimida</option><option>Oferta excepcional</option><option>Outro</option></select></div><div><label>GRUPO</label><select id="group"><option value="">—</option></select></div><div><label>TURNO</label><select id="turn"><option value="">A definir</option><option>Matutino</option><option>Vespertino</option><option>Noturno</option></select></div><div class="wide"><label>DISCIPLINA / DEMANDA</label><input id="name" placeholder="Nome da disciplina que precisa ser ofertada"></div><div><label>CURSO / CONTEXTO</label><input id="course" placeholder="Ex.: Comércio, dependência..." /></div><div class="wide"><label>OBSERVAÇÕES</label><input id="notes" placeholder="Informações adicionais"></div><div><button id="add">Adicionar demanda</button></div></div></section>
<section class="card" style="margin-top:16px"><div class="head"><div><h2 style="margin:0;font-size:16px">Demandas do semestre</h2><span class="count" id="count"></span></div></div><div class="tablewrap"><table class="demand-table"><thead><tr><th>Tipo</th><th>Disciplina</th><th>Curso/contexto</th><th>Grupo</th><th>CH</th><th>Turno</th><th>Observações</th><th>Ações</th></tr></thead><tbody id="body"></tbody></table></div></section></main>
<script>
let DB=null;const $=id=>document.getElementById(id),esc=v=>POCV.esc(v);
function groups(){const gs=[];Object.values(DB?.data?.matrices||{}).forEach(m=>(m?.disciplines||[]).forEach(d=>{if(d?.group)gs.push(d.group)}));return [...new Set(gs)].sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function load(){const sems=Object.keys(DB.data.semesters||{});sems.forEach(s=>$('semester').add(new Option(s,s)));$('semester').value=sems.includes('2027.1')?'2027.1':sems[0]||'';groups().forEach(g=>$('group').add(new Option(g,g)));build()}
function build(){const arr=DB.extraOffers?.[$('semester').value]||[];$('count').textContent=`${arr.length} demandas`;$('body').innerHTML=arr.map(x=>`<tr><td><span class="demand-badge">${esc(x.type||'Demanda')}</span></td><td>${esc(x.name)}</td><td>${esc(x.course||'—')}</td><td>${x.group?POCV.tag(x.group,'group'):'—'}</td><td>${Number(x.ch||0)} h/a</td><td>${esc(x.turn||'A definir')}</td><td>${esc(x.notes||'—')}</td><td><button class="secondary edit" data-id="${x.id}">Editar</button> <button class="delete" data-id="${x.id}">Excluir</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nenhuma demanda avulsa cadastrada.</td></tr>'}
$('semester').onchange=build;
$('add').onclick=async()=>{const name=$('name').value.trim();if(!name){alert('Informe a disciplina/demanda.');return}const r=await fetch('/api/extra-offer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({semester:$('semester').value,name,ch:Number($('ch').value)||0,type:$('type').value,group:$('group').value,turn:$('turn').value,course:$('course').value,notes:$('notes').value})});if(!r.ok){const d=await r.json().catch(()=>({}));alert(d.error||'Não foi possível adicionar.');return}DB=await (await fetch('/api/db',{cache:'no-store'})).json();$('name').value='';$('notes').value='';build()};
$('body').onclick=async e=>{const id=e.target.dataset.id;if(!id)return;if(e.target.classList.contains('delete')){if(!confirm('Excluir esta demanda avulsa?'))return;await fetch(`/api/extra-offer?semester=${encodeURIComponent($('semester').value)}&id=${encodeURIComponent(id)}`,{method:'DELETE'});}else if(e.target.classList.contains('edit')){const x=(DB.extraOffers?.[$('semester').value]||[]).find(v=>String(v.id)===String(id));if(!x)return;const name=prompt('Disciplina/demanda:',x.name);if(name==null)return;const ch=prompt('CH (h/a):',x.ch);if(ch==null)return;const group=prompt('Grupo:',x.group||'');if(group==null)return;await fetch('/api/extra-offer',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({semester:$('semester').value,id,changes:{name:name.trim(),ch:Number(ch)||0,group:group.trim()}})});}DB=await (await fetch('/api/db',{cache:'no-store'})).json();build()};
(async()=>{DB=await (await fetch('/api/db',{cache:'no-store'})).json();load()})().catch(console.error);
</script></body></html>
