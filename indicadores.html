<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACHA | Indicadores</title>
<link rel="stylesheet" href="/style.css?v=1.0.18">
<script src="/app.js?v=1.0.18"></script>
<style>
.ind-page{max-width:1500px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{margin:0;font-size:22px}.page-head p{margin:5px 0 0;color:var(--muted)}
.filters{display:grid;grid-template-columns:1.6fr 180px auto;gap:10px;align-items:end}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 8px #00000008}
.kpi .label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}
.kpi strong{display:block;font-size:25px;margin-top:3px}.kpi small{color:var(--muted)}
.ind-section{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #00000008}
.ind-title{background:#155e75;color:#fff;padding:10px 14px;font-weight:900;letter-spacing:.15px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.ind-title span{font-size:11px;font-weight:700;opacity:.9}
.ind-wrap{overflow-x:auto;overflow-y:hidden}.ind-table{width:100%;min-width:0;border-collapse:collapse;table-layout:fixed}.ind-table th:first-child,.ind-table td:first-child{width:340px;min-width:340px}.ind-table th:not(:first-child),.ind-table td:not(:first-child){width:auto}
.ind-table th,.ind-table td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;font-size:12px}
.ind-table th:first-child,.ind-table td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
.ind-table th{background:#f1f5f9;color:#475569;font-size:11px;text-transform:uppercase}
.ind-table tr.total td{font-weight:900;background:#f8fafc}
.ind-table tr.subtotal td{font-weight:800;background:#f8fafc}
.ind-table .meta-head{font-size:10px;color:var(--muted);font-weight:700;text-transform:none}
.pct{font-weight:850;color:#334155}.pct.neutral{color:#334155}.pct.good{color:#047857}.pct.warn{color:#b45309}.pct.bad{color:#b91c1c}
.pct-btn{border:0;background:none;padding:0;cursor:pointer;font:inherit}.pct-btn:hover{text-decoration:underline}
.meta-pill{display:inline-flex;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:900}
.meta-pill.ok{background:#dcfce7;color:#166534}.meta-pill.warn{background:#fef3c7;color:#92400e}.meta-pill.bad{background:#fee2e2;color:#991b1b}
.note{padding:10px 14px;color:var(--muted);font-size:11px;line-height:1.55;border-top:1px solid var(--line)}
.indicators-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.ind-table .status-cell{font-weight:900}.legend{display:flex;gap:8px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
.modal-card{background:#fff;border-radius:16px;box-shadow:0 18px 60px #0004;width:min(980px,96vw);max-height:90vh;overflow:hidden}
.modal-body{max-height:72vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);background:#f8fafc}
.modal-head strong{display:block}.modal-head small{display:block;color:var(--muted);margin-top:3px}
.modal-close{border:0;background:none;font-size:26px;cursor:pointer;color:#475569}
.modal-card .ind-table{min-width:720px}.modal-card .ind-table th:first-child,.modal-card .ind-table td:first-child{position:static}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:800}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#94a3b8}
@media(max-width:1000px){.filters{grid-template-columns:1fr 1fr}.kpi-grid{grid-template-columns:1fr 1fr}.indicators-grid{grid-template-columns:1fr}}
@media(max-width:600px){.filters{grid-template-columns:1fr}.kpi-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="page-head">
  <div><h1>Indicadores</h1><p>Indicadores calculados ano a ano para todo o período do cenário selecionado, diretamente das entradas e das matrizes cadastradas.</p></div>
</header>
<nav class="mainnav"></nav>

<main class="ind-page">
<section class="panel">
  <div class="filters">
    <div><label>CENÁRIO</label><select id="scenario"></select></div>
    <div><label>ANO DE REFERÊNCIA</label><select id="focusYear"></select></div>
    <button id="refresh">Atualizar</button>
  </div>
</section>

<div id="content"></div>
</main>

<script>
(function(){
let DB=null, SCENARIOS=[], current=null;

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const norm=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();

function matrix(mid){ return DB?.data?.matrices?.[String(mid)] || {}; }
function course(mid){ return (DB?.data?.courses||[]).find(c=>String(c.matrix)===String(mid)) || {}; }

function si(s){
  const [y,p]=String(s).split('.').map(Number);
  return y*2+(p-1);
}
function yearsForScenario(sc){
  const a=Number(String(sc.startSemester).split('.')[0]);
  const b=Number(String(sc.endSemester).split('.')[0]);
  const out=[];
  for(let y=a;y<=b;y++) out.push(y);
  return out;
}
function startsInYear(p,y){ return String(p.startSemester).startsWith(String(y)+'.'); }
function placementsAtYear(y){
  return (current?.placements||[]).filter(p=>startsInYear(p,y));
}
function qty(p){ return Math.max(1,Number(p.quantity)||1); }
function vagas(p){ return qty(p)*Math.max(0,Number(p.vacancies)||0); }

function meta(p){
  const m=matrix(p.matrix), c=course(p.matrix);
  return {
    name:c.course_name || c.name || m.name || '—',
    form:m.offerForm || c.form || '—',
    type:c.type || '',
    level:c.level || m.offerLevel || '',
    ch:Number(m.annualizedWorkloadHours ?? c.annualizedWorkloadHours) || 0
  };
}
function meq(p){ return vagas(p)*meta(p).ch/800; }

function offerForm(p){ return norm(meta(p).form); }
function isTechnical(p){ return meta(p).type==='Técnico'; }
function isTeacher(p){ return meta(p).type==='Formação de Professores'; }
function isOther(p){ return meta(p).type==='Outras Ofertas'; }
function isProeja(p){ return offerForm(p).includes('eja') || offerForm(p).includes('proeja'); }
function isNight(p){ return norm(p.turn).includes('noite') || norm(p.turn).includes('noturno'); }
function isGraduation(p){ return norm(meta(p).level).includes('graduacao') || norm(meta(p).level).includes('pós-graduação') || norm(meta(p).level).includes('pos-graduacao'); }

function techCategory(p){
  const f=offerForm(p);
  if(!isTechnical(p)) return null;
  if(f==='técnico integrado "regular"' || f==='tecnico integrado "regular"' || f==='integrado') return 'technicalIntegratedRegular';
  if(f.includes('técnico integrado eja') || f.includes('tecnico integrado eja')) return 'technicalIntegratedEja';
  if(f.includes('técnico concomitante eja') || f.includes('tecnico concomitante eja')) return 'technicalConcurrentEja';
  if(f.includes('técnico subsequente') || f.includes('tecnico subsequente')) return 'technicalSub';
  if(f.includes('técnico concomitante') || f.includes('tecnico concomitante')) return 'technicalConcurrentRegular';
  return null;
}
function proCategory(p){
  const f=offerForm(p);
  if(f.includes('técnico integrado eja') || f.includes('tecnico integrado eja')) return 'technicalIntegratedEja';
  if(f.includes('técnico concomitante eja') || f.includes('tecnico concomitante eja')) return 'technicalConcurrentEja';
  if(f.includes('fic integrado a eja médio') || f.includes('fic integrado eja médio') || f.includes('fic integrado a eja medio') || f.includes('fic integrado eja medio')) return 'ficIntegratedEjaMedio';
  if(f.includes('fic concomitante a eja fundamental') || f.includes('fic concomitante eja fundamental')) return 'ficConcurrentEjaFundamental';
  if(f.includes('fic concomitante a eja médio') || f.includes('fic concomitante eja medio')) return 'ficConcurrentEjaMedio';
  return null;
}

function calcularIndicadoresAno(ano){
  // Regra: somente entradas cuja coorte começa no ano letivo.
  // Continuidade em 2º semestre não gera nova entrada.
  const entradas=(current?.placements||[]).filter(p=>startsInYear(p,ano));

  const totalVagas=entradas.reduce((s,p)=>s+vagas(p),0);
  const totalMEq=entradas.reduce((s,p)=>s+meq(p),0);

  const techCats={
    technicalIntegratedRegular:0,
    technicalIntegratedEja:0,
    technicalConcurrentEja:0,
    technicalSub:0,
    technicalConcurrentRegular:0
  };
  const proCats={
    technicalIntegratedEja:0,
    technicalConcurrentEja:0,
    ficIntegratedEjaMedio:0,
    ficConcurrentEjaFundamental:0,
    ficConcurrentEjaMedio:0
  };

  entradas.forEach(p=>{
    const tc=techCategory(p);
    if(tc) techCats[tc]+=meq(p);

    const pc=proCategory(p);
    if(pc) proCats[pc]+=meq(p);
  });

  const tech=Object.values(techCats).reduce((s,v)=>s+v,0);
  const pro=Object.values(proCats).reduce((s,v)=>s+v,0);
  const teacher=entradas.filter(isTeacher).reduce((s,p)=>s+meq(p),0);
  const other=entradas.filter(isOther).reduce((s,p)=>s+meq(p),0);

  const nightVagas=entradas.filter(isNight).reduce((s,p)=>s+vagas(p),0);
  const gradVagas=entradas.filter(isGraduation).reduce((s,p)=>s+vagas(p),0);
  const nightGradVagas=entradas.filter(p=>isGraduation(p)&&isNight(p)).reduce((s,p)=>s+vagas(p),0);

  return {
    ano,
    entries:entradas,
    totalVagas,totalMEq,
    tech,pro,teacher,
    nightVagas,gradVagas,nightGradVagas,
    techCats,proCats,
    percentuais:{
      tecnico:pct(tech,totalMEq),
      proeja:pct(pro,totalMEq),
      formacaoProfessores:pct(teacher,totalMEq),
      outras:pct(other,totalMEq),
      vagasNoturnas:pct(nightVagas,totalVagas),
      vagasNoturnasGraduacao:pct(nightGradVagas,gradVagas)
    }
  };
}

// Compatibilidade com os pontos da página que já chamavam annual().
function annual(ano){ return calcularIndicadoresAno(ano); }

function calcularIndicadoresCenario(cenario){
  const anterior=current;
  current=cenario;
  const anos=yearsForScenario(cenario);
  const resultado=anos.map(ano=>calcularIndicadoresAno(ano));
  current=anterior;
  return resultado;
}

const metas={
  tech:[0.60,1],
  pro:[0.10,1],
  teacher:[0.20,1],
  other:[0,0.20],
  nightGrad:[0.333,0.333]
};
function metaBand(y,key){ return metas[key] || null; }
function statusPct(value, band, key){
  if(key==='other') {
    if(value < 0.18) return 'good';
    if(value < 0.20) return 'warn';
    return 'bad';
  }
  if(!band) return 'neutral';
  if(value>=band[0]) return 'good';
  if(value>=band[0]*0.95) return 'warn';
  return 'bad';
}
function fmt(n,d=0){ return Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function pct(n,d){ return d ? 100*n/d : 0; }
function bandText(band){
  if(!band) return '—';
  const a=band[0]*100,b=band[1]*100;
  return Math.abs(a-b)<0.001 ? fmt(a,1)+'%' : fmt(a,1)+'–'+fmt(b,1)+'%';
}
function metaMeq(total,band){
  if(!band) return '—';
  if(band[1]>=0.999) return '≥ '+fmt(total*band[0],1);
  const a=total*band[0],b=total*band[1];
  return Math.abs(a-b)<0.001 ? fmt(a,1) : fmt(a,1)+'–'+fmt(b,1);
}
function pctButton(value,band,key,year){
  const st=statusPct(value,band,key);
  return `<button class="pct-btn pct ${st}" data-key="${esc(key)}" data-year="${year}">${fmt(value,2)}%</button>`;
}

function consideredOffers(y,key){
  const e=placementsAtYear(y);
  return e.filter(p=>{
    if(key==='tech') return isTechnical(p);
    if(key==='pro') return !!proCategory(p);
    if(key==='teacher') return isTeacher(p);
    if(key==='other') return isOther(p);
    if(key==='night') return isNight(p);
    if(key==='nightGrad') return isGraduation(p)&&isNight(p);
    return false;
  });
}
function showModal(key,y){
  const labels={
    tech:'% Técnico',
    pro:'% PROEJA',
    teacher:'% Formação de professores',
    other:'% Outras ofertas',
    night:'% Vagas noturnas',
    nightGrad:'% Vagas noturnas em graduação'
  };
  const items=consideredOffers(y,key);
  const denominator=annual(y).totalMEq;
  const totalV=annual(y).totalVagas;
  const isMEq=['tech','pro','teacher'].includes(key);
  const numerator=isMEq ? items.reduce((a,p)=>a+meq(p),0) : items.reduce((a,p)=>a+vagas(p),0);
  const den=isMEq ? denominator : totalV;

  const modal=document.createElement('div');
  modal.className='modal-backdrop';
  modal.innerHTML=`
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <strong>${esc(labels[key])} — ${y}</strong>
          <small>${items.length} oferta(s) considerada(s) · numerador ${isMEq?fmt(numerator,1)+' MEq':fmt(numerator)+' vagas'} · denominador ${isMEq?fmt(den,1)+' MEq':fmt(den)+' vagas'}</small>
        </div>
        <button class="modal-close" type="button">×</button>
      </div>
      <div class="modal-body">
        <table class="ind-table">
          <thead><tr><th>CURSO / MATRIZ</th><th>FORMA</th><th>ENTRADA</th><th>TURNO</th><th>VAGAS</th><th>CH ANUAL</th><th>MEq</th></tr></thead>
          <tbody>
          ${items.length ? items.map(p=>{
            const m=meta(p);
            return `<tr>
              <td style="text-align:left;font-weight:800">${esc(m.name)}</td>
              <td>${esc(m.form)}</td>
              <td>${esc(p.startSemester)}</td>
              <td>${esc(p.turn||'A definir')}</td>
              <td>${fmt(vagas(p))}</td>
              <td>${fmt(m.ch)}</td>
              <td>${fmt(meq(p),1)}</td>
            </tr>`;
          }).join('') : `<tr><td colspan="7" style="text-align:center">Nenhuma oferta considerada.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector('.modal-close').onclick=()=>modal.remove();
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove()});
}

function render(){
  current=SCENARIOS.find(s=>String(s.id)==String($('scenario').value))||SCENARIOS[0];
  if(!current) return;

  // A mesma fórmula é executada independentemente para TODOS os anos do cenário selecionado.
  const years=yearsForScenario(current);
  const calculos=calcularIndicadoresCenario(current);
  const all=calculos.map(r=>[r.ano,r]);
  const focus=Number($('focusYear').value)||years[0];
  const f=calculos.find(r=>r.ano===focus)||calculos[0];

  const techPct=pct(f.tech,f.totalMEq);
  const proPct=pct(f.pro,f.totalMEq);
  const teacherPct=pct(f.teacher,f.totalMEq);
  const otherPct=pct(f.other,f.totalMEq);
  const nightPct=pct(f.nightVagas,f.totalVagas);
  const nightGradPct=pct(f.nightGradVagas,f.gradVagas);

  let html=`<div class="kpi-grid">
    <div class="kpi"><div class="label">MEq total — ${focus}</div><strong>${fmt(f.totalMEq,1)}</strong><small>entradas do ano letivo</small></div>
    <div class="kpi"><div class="label">% Técnico</div><strong class="pct ${statusPct(techPct,metaBand(f.ano,'tech'),'tech')}">${fmt(techPct,2)}%</strong><small>${fmt(f.tech,1)} MEq</small></div>
    <div class="kpi"><div class="label">% PROEJA</div><strong class="pct ${statusPct(proPct,metaBand(f.ano,'pro'),'pro')}">${fmt(proPct,2)}%</strong><small>${fmt(f.pro,1)} MEq</small></div>
    <div class="kpi"><div class="label">% Formação de professores</div><strong class="pct ${statusPct(teacherPct,metaBand(f.ano,'teacher'),'teacher')}">${fmt(teacherPct,2)}%</strong><small>${fmt(f.teacher,1)} MEq</small></div>
  </div>`;

  html+=`<section class="ind-section">
    <div class="ind-title"><span>INDICADORES — DISTRIBUIÇÃO DA OFERTA</span><span>Valores calculados para as entradas de cada ano do cenário</span></div>
    <div class="ind-wrap"><table class="ind-table">
      <thead><tr><th>INDICADOR</th>${years.map(y=>`<th>${y}</th>`).join('')}</tr></thead>
      <tbody>
        <tr class="subtotal"><td>% Técnico</td>${all.map(([y,m])=>`<td>${pctButton(pct(m.tech,m.totalMEq),metaBand(y,'tech'),'tech',y)}</td>`).join('')}</tr>
        <tr><td>Meta (MEq)</td>${all.map(([y,m])=>`<td>${metaMeq(m.totalMEq,metaBand(y,'tech'))}</td>`).join('')}</tr>
        <tr class="subtotal"><td>% PROEJA</td>${all.map(([y,m])=>`<td>${pctButton(pct(m.pro,m.totalMEq),metaBand(y,'pro'),'pro',y)}</td>`).join('')}</tr>
        <tr><td>Meta (MEq)</td>${all.map(([y,m])=>`<td>${metaMeq(m.totalMEq,metaBand(y,'pro'))}</td>`).join('')}</tr>
        <tr class="subtotal"><td>% Formação de professores</td>${all.map(([y,m])=>`<td>${pctButton(pct(m.teacher,m.totalMEq),metaBand(y,'teacher'),'teacher',y)}</td>`).join('')}</tr>
        <tr><td>Meta (MEq)</td>${all.map(([y,m])=>`<td>${metaMeq(m.totalMEq,metaBand(y,'teacher'))}</td>`).join('')}</tr>
        <tr class="subtotal"><td>% Outras ofertas</td>${all.map(([y,m])=>`<td>${pctButton(pct(m.other,m.totalMEq),metaBand(y,'other'),'other',y)}</td>`).join('')}</tr>
        <tr><td>Meta</td>${all.map(([y])=>`<td>&lt; 20%</td>`).join('')}</tr>
        <tr class="subtotal"><td>% Vagas noturnas</td>${all.map(([y,m])=>`<td><button class="pct-btn pct neutral" data-key="night" data-year="${y}">${fmt(pct(m.nightVagas,m.totalVagas),2)}%</button></td>`).join('')}</tr>
        <tr class="subtotal"><td>% Vagas noturnas em graduação</td>${all.map(([y,m])=>`<td><button class="pct-btn pct ${statusPct(pct(m.nightGradVagas,m.gradVagas),metaBand(y,'nightGrad'),'nightGrad')}" data-key="nightGrad" data-year="${y}">${fmt(pct(m.nightGradVagas,m.gradVagas),2)}%</button></td>`).join('')}</tr>
        <tr><td>Meta</td>${all.map(([y])=>`<td>${y>=2028?'33,3%':'33,3%'}</td>`).join('')}</tr>
      </tbody>
    </table></div>
    <div class="note">
      <strong>Regra aplicada em todos os anos:</strong> MEq = vagas de entrada × (carga horária anualizada ÷ 800). 
      As ofertas são contabilizadas somente na coorte que inicia no ano; a continuidade em outro semestre não gera nova entrada.
      Os percentuais de Técnico, PROEJA, Formação de professores e Outras ofertas usam MEq. Os percentuais de vagas noturnas usam vagas físicas.
      <strong>Clique em qualquer percentual</strong> para ver exatamente quais ofertas entraram no numerador.
    </div>
    <div class="legend"><span class="meta-pill ok">VERDE = atende à meta</span><span class="meta-pill warn">AMARELO = próximo do limite</span><span class="meta-pill bad">VERMELHO = não atende</span><span>% Técnico ≥ 60% · % PROEJA ≥ 10% · % Formação de professores ≥ 20% · % Outras ofertas &lt; 20%</span></div>
  </section>`;

  html+=`<div class="indicators-grid">
    <section class="ind-section">
      <div class="ind-title">VAGAS EQUIVALENTES — CURSOS TÉCNICOS</div>
      <div class="ind-wrap"><table class="ind-table">
        <thead><tr><th>FORMA DE OFERTA</th>${years.map(y=>`<th>${y}</th>`).join('')}</tr></thead>
        <tbody>
          <tr><td>Técnico integrado "regular"</td>${all.map(([y,m])=>`<td>${fmt(m.techCats.technicalIntegratedRegular,1)}</td>`).join('')}</tr>
          <tr><td>Técnico integrado EJA</td>${all.map(([y,m])=>`<td>${fmt(m.techCats.technicalIntegratedEja,1)}</td>`).join('')}</tr>
          <tr><td>Técnico concomitante EJA</td>${all.map(([y,m])=>`<td>${fmt(m.techCats.technicalConcurrentEja,1)}</td>`).join('')}</tr>
          <tr><td>Técnico subsequente</td>${all.map(([y,m])=>`<td>${fmt(m.techCats.technicalSub,1)}</td>`).join('')}</tr>
          <tr><td>Técnico concomitante "regular"</td>${all.map(([y,m])=>`<td>${fmt(m.techCats.technicalConcurrentRegular,1)}</td>`).join('')}</tr>
          <tr class="total"><td>TOTAL TÉCNICO</td>${all.map(([y,m])=>`<td>${fmt(m.tech,1)}</td>`).join('')}</tr>
        </tbody>
      </table></div>
      <div class="note">Cada linha é calculada pela fórmula de MEq. Como os técnicos têm 800 h anualizadas nas matrizes atuais, cada 40 vagas equivalem a 40 MEq.</div>
    </section>

    <section class="ind-section">
      <div class="ind-title">VAGAS EQUIVALENTES — PROEJA</div>
      <div class="ind-wrap"><table class="ind-table">
        <thead><tr><th>FORMA DE OFERTA</th>${years.map(y=>`<th>${y}</th>`).join('')}</tr></thead>
        <tbody>
          <tr><td>Técnico integrado EJA</td>${all.map(([y,m])=>`<td>${fmt(m.proCats.technicalIntegratedEja,1)}</td>`).join('')}</tr>
          <tr><td>Técnico concomitante EJA</td>${all.map(([y,m])=>`<td>${fmt(m.proCats.technicalConcurrentEja,1)}</td>`).join('')}</tr>
          <tr><td>FIC integrado a EJA médio</td>${all.map(([y,m])=>`<td>${fmt(m.proCats.ficIntegratedEjaMedio,1)}</td>`).join('')}</tr>
          <tr><td>FIC concomitante a EJA fundamental</td>${all.map(([y,m])=>`<td>${fmt(m.proCats.ficConcurrentEjaFundamental,1)}</td>`).join('')}</tr>
          <tr><td>FIC concomitante a EJA médio</td>${all.map(([y,m])=>`<td>${fmt(m.proCats.ficConcurrentEjaMedio,1)}</td>`).join('')}</tr>
          <tr class="total"><td>TOTAL PROEJA</td>${all.map(([y,m])=>`<td>${fmt(m.pro,1)}</td>`).join('')}</tr>
        </tbody>
      </table></div>
      <div class="note">A mesma oferta EJA pode aparecer na tabela de Técnicos e na tabela de PROEJA porque PROEJA é um recorte da oferta técnica. Não se soma as duas tabelas para formar o total geral.</div>
    </section>
  </div>`;

  html+=`<section class="ind-section">
    <div class="ind-title"><span>RESUMO DAS ENTRADAS POR ANO LETIVO</span><span>${esc(current.name)}</span></div>
    <div class="ind-wrap"><table class="ind-table">
      <thead><tr><th>INDICADOR</th>${years.map(y=>`<th>${y}</th>`).join('')}</tr></thead>
      <tbody>
        <tr class="total"><td>Vagas físicas de entrada</td>${all.map(([y,m])=>`<td>${fmt(m.totalVagas)}</td>`).join('')}</tr>
        <tr><td>Matrículas equivalentes totais</td>${all.map(([y,m])=>`<td>${fmt(m.totalMEq,1)}</td>`).join('')}</tr>
        <tr><td>Vagas noturnas</td>${all.map(([y,m])=>`<td>${fmt(m.nightVagas)}</td>`).join('')}</tr>
        <tr><td>Vagas de graduação</td>${all.map(([y,m])=>`<td>${fmt(m.gradVagas)}</td>`).join('')}</tr>
        <tr><td>Vagas noturnas de graduação</td>${all.map(([y,m])=>`<td>${fmt(m.nightGradVagas)}</td>`).join('')}</tr>
      </tbody>
    </table></div>
  </section>`;

  html+=`<section class="ind-section">
    <div class="ind-title">FORMAÇÃO DE PROFESSORES — MATRÍCULAS EQUIVALENTES</div>
    <div class="ind-wrap"><table class="ind-table">
      <thead><tr><th>TIPO</th>${years.map(y=>`<th>${y}</th>`).join('')}</tr></thead>
      <tbody>
        <tr><td>Graduação / Licenciatura</td>${all.map(([y,m])=>`<td>${fmt(m.entries.filter(p=>isTeacher(p)&&norm(meta(p).level).includes('graduacao')).reduce((a,p)=>a+meq(p),0),1)}</td>`).join('')}</tr>
        <tr><td>Pós-graduação</td>${all.map(([y,m])=>`<td>${fmt(m.entries.filter(p=>isTeacher(p)&&norm(meta(p).level).includes('pos-graduacao')).reduce((a,p)=>a+meq(p),0),1)}</td>`).join('')}</tr>
        <tr class="total"><td>TOTAL FORMAÇÃO DE PROFESSORES</td>${all.map(([y,m])=>`<td>${fmt(m.teacher,1)}</td>`).join('')}</tr>
      </tbody>
    </table></div>
  </section>`;

  $('content').innerHTML=html;
}

function fill(){
  $('scenario').innerHTML=SCENARIOS.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}${s.isReal?' · cenário real':''}</option>`).join('');
  current=SCENARIOS[0];
  $('scenario').value=current.id;
  const years=yearsForScenario(current);
  $('focusYear').innerHTML=years.map(y=>`<option value="${y}">${y}</option>`).join('');
  $('focusYear').value=years[0];
  render();
}
async function load(){
  const [a,b]=await Promise.all([
    fetch('/api/db',{cache:'no-store'}),
    fetch('/api/pocv/scenarios',{cache:'no-store'})
  ]);
  const db=await a.json(), sc=await b.json();
  if(!a.ok) throw Error(db.error||'Falha ao carregar banco');
  if(!b.ok) throw Error(sc.error||'Falha ao carregar cenários');
  DB=db; SCENARIOS=sc.scenarios||[];
  fill();
}
$('scenario').onchange=()=>{
  current=SCENARIOS.find(s=>String(s.id)===String($('scenario').value))||SCENARIOS[0];
  const years=yearsForScenario(current);
  const old=$('focusYear').value;
  $('focusYear').innerHTML=years.map(y=>`<option value="${y}">${y}</option>`).join('');
  $('focusYear').value=years.includes(Number(old))?old:years[0];
  render();
};
$('focusYear').onchange=render;
$('refresh').onclick=render;
document.addEventListener('click',e=>{
  const b=e.target.closest('.pct-btn');
  if(b) showModal(b.dataset.key,Number(b.dataset.year));
});
load().catch(e=>{
  console.error(e);
  $('content').innerHTML=`<section class="panel" style="padding:16px;color:#b91c1c">Não foi possível carregar os indicadores: ${esc(e.message)}</section>`;
});
})();
</script>
</body>
</html>
