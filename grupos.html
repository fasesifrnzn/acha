<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grupos | POCV</title><link rel="stylesheet" href="style.css"><style>
.group-card{overflow:hidden}.group-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.group-controls input{max-width:360px}.group-actions{margin-left:auto;display:flex;gap:8px}.group-table{width:100%;border-collapse:collapse;table-layout:fixed}.group-table th,.group-table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}.group-table th{position:sticky;top:0;background:#f8fafc;color:#475569;font-size:12px;z-index:2}.group-table th button{width:100%;background:transparent;color:#334155;text-align:left;padding:8px 0}.group-row{cursor:pointer}.group-row:hover td{background:#f8fafc}.group-row.open td{background:#f0fdfa}.detail-row td{padding:0!important;background:#fff!important}.detail-panel{padding:14px 16px;border-bottom:1px solid var(--line);background:#f8fafc}.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.detail-head h3{margin:0;font-size:15px;flex:1}.detail-table{overflow:auto}.detail-table table{width:100%;min-width:850px;border-collapse:collapse;background:#fff}.detail-table th,.detail-table td{padding:8px;border-bottom:1px solid var(--line);text-align:left}.detail-table th{background:#f1f5f9;font-size:12px}.detail-table select{width:100%;padding:7px;border:1px solid #cbd5e1;border-radius:8px}.detail-state{font-size:12px;color:var(--muted)}.empty-detail{padding:22px;text-align:center;color:var(--muted)}
</style></head><body><header><h1>Grupos</h1><p>Grupos docentes encontrados nas matrizes e professores vinculados.</p></header><nav class="mainnav"></nav><main>
<section class="card group-card"><div class="head"><div><h2 style="margin:0;font-size:16px">Grupos</h2><span class="count" id="count"></span></div><div class="group-controls"><input id="q" placeholder="Pesquisar grupo..."><div class="group-actions"><button class="secondary" id="openAll">Abrir todos</button><button class="secondary" id="closeAll">Recolher todos</button></div></div></div>
<div class="tablewrap"><table class="group-table"><thead><tr><th data-key="group" style="width:55%"><button class="sort" data-key="group">Grupo ↕</button></th><th data-key="n" style="width:20%"><button class="sort" data-key="n">Disciplinas ↕</button></th><th data-key="ch"><button class="sort" data-key="ch">CH cadastrada ↕</button></th></tr></thead><tbody id="b"></tbody></table></div></section>
</main><script src="app.js"></script><script>
let DB=null;const state={open:new Set(),sortKey:'group',sortDir:1};const $=id=>document.getElementById(id);const esc=v=>POCV.esc(v);const norm=v=>POCV.norm(v);
function groupData(){const d={};Object.values(DB?.data?.matrices||{}).forEach(m=>(m.disciplines||[]).forEach(x=>{const g=String(x.group||'').trim();if(!g)return;const key=g;d[key]??={n:0,ch:0};d[key].n++;d[key].ch+=Object.values(x.periods||{}).reduce((a,b)=>a+Number(b||0),0)}));return d}
function teacherRows(g){return (DB.teachers||[]).filter(t=>String(t.group||'').trim()===g).sort((a,b)=>String(a.name).localeCompare(String(b.name),'pt-BR',{sensitivity:'base'}))}
function situation(t){const p=[];if(t.leave&&t.leave!=='Não se aplica')p.push(t.leave);if(t.management&&t.management!=='Não se aplica')p.push(t.management);return p.join(' · ')||'Regular'}
function disciplineOptions(selected){const vals=[...new Set((DB.teachers||[]).map(t=>String(t.discipline||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR',{sensitivity:'base'}));if(selected&&!vals.includes(selected))vals.push(selected);return '<option value="">— Não informado —</option>'+vals.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}
function groupOptions(selected){const vals=Object.keys(groupData()).sort((a,b)=>a.localeCompare(b,'pt-BR',{sensitivity:'base'}));if(selected&&!vals.includes(selected))vals.push(selected);return '<option value="">—</option>'+vals.map(v=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}
function detailRow(g){const rows=teacherRows(g);return `<tr class="detail-row" data-detail="${esc(g)}"><td colspan="3"><div class="detail-panel"><div class="detail-head"><h3>Professores de ${POCV.tag(g,'group')}</h3><span class="detail-state" data-state="${esc(g)}"></span><button type="button" class="secondary close-one" data-close="${esc(g)}">Recolher</button></div><div class="detail-table"><table><thead><tr><th>Docente</th><th>Disciplina / área</th><th>Grupo</th><th>Vínculo</th><th>Regime</th><th>Situação</th></tr></thead><tbody>${rows.length?rows.map(t=>`<tr data-id="${t.id}"><td><b>${esc(t.name)}</b></td><td><select class="teacher-edit" data-field="discipline">${disciplineOptions(t.discipline||'')}</select></td><td><select class="teacher-edit" data-field="group">${groupOptions(t.group||'')}</select></td><td>${esc(t.vinculo||'—')}</td><td>${esc(t.regime||'—')}</td><td>${esc(situation(t))}</td></tr>`).join(''):`<tr><td colspan="6" class="empty-detail">Nenhum professor vinculado a este grupo.</td></tr>`}</tbody></table></div></div></td></tr>`}
function build(){const d=groupData(),q=norm($('q').value);let rows=Object.entries(d).filter(([g])=>!q||norm(g).includes(q));rows.sort((a,b)=>{let av=state.sortKey==='group'?a[0]:a[1][state.sortKey],bv=state.sortKey==='group'?b[0]:b[1][state.sortKey];const n1=Number(av),n2=Number(bv);const c=Number.isFinite(n1)&&Number.isFinite(n2)?n1-n2:String(av).localeCompare(String(bv),'pt-BR',{numeric:true,sensitivity:'base'});return c*state.sortDir});POCV.setGroups(Object.keys(d));$('count').textContent=`${rows.length} grupos`;$('b').innerHTML=rows.map(([g,v])=>`<tr class="group-row ${state.open.has(g)?'open':''}" data-group="${esc(g)}"><td>${POCV.tag(g,'group')}</td><td>${v.n}</td><td>${v.ch.toLocaleString('pt-BR')}</td></tr>${state.open.has(g)?detailRow(g):''}`).join('')||'<tr><td colspan="3" class="empty">Nenhum grupo encontrado.</td></tr>';document.querySelectorAll('.sort').forEach(btn=>{const k=btn.dataset.key;const label={group:'Grupo',n:'Disciplinas',ch:'CH cadastrada'}[k];btn.textContent=label+' '+(state.sortKey===k?(state.sortDir===1?'↑':'↓'):'↕')})}
async function saveTeacher(id,field,value,g){const stateEl=document.querySelector(`[data-state="${CSS.escape(g)}"]`);if(stateEl)stateEl.textContent='Salvando…';try{const r=await fetch('/api/teacher',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,changes:{[field]:value}})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`Servidor respondeu ${r.status}`);DB=await (await fetch('/api/db',{cache:'no-store'})).json();if(stateEl)stateEl.textContent='Salvo automaticamente';build();setTimeout(()=>{const x=document.querySelector(`[data-state="${CSS.escape(g)}"]`);if(x)x.textContent=''},1200)}catch(e){if(stateEl)stateEl.textContent='Erro ao salvar';alert('Não foi possível salvar: '+e.message);build()}}
$('q').oninput=build;$('b').addEventListener('click',e=>{const row=e.target.closest('.group-row');if(!row)return;const g=row.dataset.group;if(state.open.has(g))state.open.delete(g);else state.open.add(g);build()});$('b').addEventListener('click',e=>{const btn=e.target.closest('.close-one');if(!btn)return;state.open.delete(btn.dataset.close);build()});$('b').addEventListener('change',e=>{const el=e.target.closest('.teacher-edit');if(!el)return;const tr=el.closest('tr'),id=Number(tr.dataset.id),field=el.dataset.field;saveTeacher(id,field,el.value,tr.closest('.detail-row').dataset.detail)});
$('openAll').onclick=()=>{state.open=new Set(Object.keys(groupData()));build()};$('closeAll').onclick=()=>{state.open.clear();build()};document.querySelectorAll('.sort').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(state.sortKey===k)state.sortDir*=-1;else{state.sortKey=k;state.sortDir=1}build()});
(async()=>{DB=await (await fetch('/api/db',{cache:'no-store'})).json();build()})().catch(e=>{console.error(e);$('b').innerHTML='<tr><td colspan="3" class="empty">Erro ao carregar grupos.</td></tr>'});
</script></body></html>
