services:
  acha-schema:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acha-schema
    restart: "no"
    environment:
      NODE_ENV: production
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acha}
    networks:
      - database_network
    command: ["node", "scripts/init-mysql-schema.js"]

  acha:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acha
    restart: unless-stopped
    ports:
      - "5002:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acha}
    volumes:
      - ./acha-data:/var/data
    networks:
      - database_network
      - proxy_network
    depends_on:
      acha-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  database_network:
    external: true
  proxy_network:
    external: true
