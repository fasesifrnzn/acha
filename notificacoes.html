<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACHA — Notificações</title><link rel="stylesheet" href="/style.css?v=1.0.130"><script src="/app.js?v=1.0.130"></script><style>.wrap{max-width:1000px;margin:22px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}.notice{padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}.notice.unread{border-left:4px solid #0f766e;background:#f8fffe}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:#64748b;font-size:12px}.notification-link{cursor:pointer}.notification-link:hover{background:#f1f5f9}.read{background:#e2e8f0;color:#334155;border:0;border-radius:8px;padding:8px 11px;font-weight:800}</style></head><body><nav class="mainnav"></nav><main class="wrap"><section class="card"><div class="top"><div><h1 style="margin:0">Notificações</h1><p class="muted">Resultado das validações das suas solicitações.</p></div><button class="read" id="readAll">Marcar todas como lidas</button></div><div id="body" style="margin-top:18px"></div></section></main><script>const $=id=>document.getElementById(id),esc=v=>POCV.esc(v);async function load(){const r=await fetch('/api/notifications',{cache:'no-store'});if(!r.ok)return;const j=await r.json();$('body').innerHTML=(j.notifications||[]).map(n=>`<article class="notice ${n.read?'':'unread'} notification-link" data-semester="${esc(n.semester||'')}" data-target="${esc(n.targetKey||'')}"><strong>${esc(n.title)}</strong><div style="margin:6px 0">${esc(n.message)}</div><div class="muted">${new Date(n.createdAt).toLocaleString('pt-BR')}</div></article>`).join('')||'<p class="muted">Nenhuma notificação.</p>'}$('body').onclick=e=>{const n=e.target.closest('.notification-link');if(!n)return;const p=new URLSearchParams({semester:n.dataset.semester||'',status:'all'});if(n.dataset.target){const x=n.dataset.target.split('|');if(x[0])p.set('matrix',x[0]);if(x[1])p.set('period',x[1]);}location.href='index.html?'+p.toString()};$('readAll').onclick=async()=>{await fetch('/api/notifications/read-all',{method:'PUT'});load()};load();</script></body></html>
