.row-actions{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:nowrap;min-width:70px;width:auto;height:32px}.row-actions .more-dropdown{display:none!important}.row-actions .icon-action{box-sizing:border-box;width:32px;height:32px;min-width:32px;max-width:32px;padding:0;border:1px solid transparent;background:#0f766e;color:#fff;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;line-height:1;box-shadow:0 1px 2px #0002;cursor:pointer}.row-actions .icon-action:hover{background:#115e59;color:#fff;border-color:transparent}.row-actions .validate-offer:disabled{opacity:.75;cursor:default}.row-actions .more-menu{position:relative;display:inline-flex}.row-actions .more-btn{font-weight:900;font-size:16px;line-height:1;background:#334155;border-color:transparent;color:#fff}.row-actions .more-btn:hover{background:#1e293b;border-color:transparent}.row-actions .decision-approved{background:#0f766e!important;border-color:transparent!important;cursor:default!important}.row-actions .decision-undone{background:#64748b!important;border-color:transparent!important;cursor:default!important}

.batchbar{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#f0fdfa}.batchbar.show{display:flex}.batchbar strong{margin-right:auto;color:#0f766e}
.selectbox{width:18px;height:18px}.muted{color:#64748b;font-size:12px}.change-summary{margin-top:5px;padding:7px 9px;border-left:3px solid #0f766e;background:#f8fafc;border-radius:6px;font-size:12px;line-height:1.5;overflow-wrap:anywhere}.change-summary b{font-weight:800;color:#334155}.change-stack{margin-top:5px;padding:6px 8px;border-left:3px solid #0f766e;background:#f8fafc;border-radius:6px;font-size:11px;line-height:1.45;overflow-wrap:anywhere}.change-stack>div{margin:1px 0}

@media(max-width:1000px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}}
@media(max-width:720px){.wrap{margin:12px auto;padding:0 10px}.head{padding:13px}.filters{grid-template-columns:1fr;padding:10px}.tablewrap{overflow:visible;max-height:none}.table{display:block;table-layout:auto}.table thead{display:none}.table tbody{display:grid;gap:10px}.table tr{display:grid;grid-template-columns:1fr auto;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;box-shadow:0 1px 4px #00000008}.table td{display:block;min-width:0;max-width:none;padding:7px 10px;border-bottom:0;white-space:normal;overflow:visible;text-overflow:clip}.table td:nth-child(1){position:absolute;margin:7px 0 0 7px;padding:0;z-index:2}.table td:nth-child(2){grid-column:1/-1;grid-row:1;padding-left:38px;font-weight:700}.table td:nth-child(3){grid-column:2;grid-row:1;text-align:right}.table td:nth-child(4){grid-column:1/-1;grid-row:2}.table td:nth-child(5){grid-column:1/-1;grid-row:3}.table td:nth-child(6){grid-column:1/-1;grid-row:4}.table td:nth-child(7){grid-column:1/-1;grid-row:5}.table td:nth-child(8){grid-column:1/-1;grid-row:6;border-top:1px solid #f1f5f9}.table td:nth-child(9){grid-column:1/-1;grid-row:7;border-top:1px solid var(--line);padding:9px 10px;text-align:left}.row-actions{justify-content:flex-start;width:auto}.actions{width:100%}.actions .btn2{flex:1;min-width:110px}.batchbar{flex-wrap:wrap}.batchbar strong{margin-right:auto}}
</style></head><body><nav class="mainnav"></nav><main class="wrap"><section class="card"><div class="head"><div><h1 style="margin:0;font-size:20px">Pendências de validação</h1><div class="muted">Solicitações dos coordenadores aguardando julgamento da Direção.</div></div></div><div class="filters"><select id="status"><option value="">Todos os status</option><option value="pending">Pendentes</option><option value="approved">Aprovadas</option><option value="correction_requested">Solicitada correção</option></select><select id="kind"><option value="">Todos os tipos</option><option value="offer">Ofertas</option><option value="extra">Demandas avulsas</option></select><input id="q" placeholder="Buscar por curso, disciplina ou coordenador..."></div><div id="batchbar" class="batchbar"><input id="selectAllPending" class="selectbox" type="checkbox"><strong id="selectedPending">0 selecionadas</strong><button id="approveSelected" class="btn2 ok" type="button">✓ Aprovar selecionadas</button><button id="clearSelected" class="btn2" type="button">Limpar seleção</button></div><div class="tablewrap"><table class="table"><thead><tr><th class="select-header" style="width:42px;min-width:42px;padding:8px;overflow:visible"><input id="selectAllHeader" class="selectbox" type="checkbox" title="Selecionar todas as pendentes"></th><th>Data / Solicitante</th><th>Semestre</th><th>Turma</th><th>Turno</th><th>Curso</th><th>Item</th><th>Status</th><th>Decisão</th></tr></thead><tbody id="body"></tbody></table></div></section></main><div id="detailModal" class="detail-modal"><div class="detail-modal-box"><div class="detail-modal-head"><div><h2 id="detailTitle">Detalhes da pendência</h2><div class="muted">Resumo da solicitação e das alterações realizadas.</div></div><button id="closeDetail" class="detail-close" type="button" aria-label="Fechar">✕</button></div><div id="detailBody" class="detail-body"></div></div></div><script>
let data=[];const $=id=>document.getElementById(id),esc=v=>POCV.esc(v);
function label(a){return String(a.type||'').startsWith('offer')?'Oferta':'Demanda avulsa'}
function text(a){if(String(a.type||'').startsWith('offer_')){const raw=String(a.targetKey||'').split('|'),m=(window._dbData?.matrices||{})[raw[0]]||{},d=m.disciplines?.[Number(String(raw[3]||'').split('::')[0])];const course=POCV?.courseName?POCV.courseName(window._dbData?.courses||[],raw[0]):((window._dbData?.courses||[]).find(c=>String(c.matrix)===String(raw[0]))?.name||a.snapshot?.course||'Oferta');const opt=Array.isArray(a.changes?.optionalChoices)?a.changes.optionalChoices.filter(Boolean):(a.changes?.optionalChoice?[a.changes.optionalChoice]:[]);return `${course} · ${opt.length?opt.join(' + '):(d?.name||a.snapshot?.name||'Oferta')}`;}return a.targetLabel||a.proposed?.name||a.snapshot?.name||a.targetKey||'—'}
function changeLines(a){const c=a.changes||{},s=a.snapshot||{},out=[];if(a.action==='delete')out.push('Exclusão da oferta');if(a.type==='offer_duplicate'){out.push(`Duplicidade: ${Math.max(2,Number(a.duplicate?.quantity||2))} ofertas no total`);if(a.changes?.notes)out.push(`Justificativa: ${a.changes.notes}`);return out}if((a.type==='offer_confirm'||a.type==='offer_change')&&c.optionalChoices?.length)out.push(`Optativa: ${c.optionalChoices.join(' + ')}`);if(c.name!==undefined&&String(c.name)!==String(s.name||''))out.push(`Disciplina: ${s.name||'—'} → ${c.name}`);if(c.course!==undefined&&String(c.course)!==String(s.course||''))out.push(`Curso: ${c.courseLabel||c.course}`);if(c.group!==undefined&&String(c.group)!==String(s.group||''))out.push(`Grupo: ${s.group||'—'} → ${c.group}`);if(c.ch!==undefined&&Number(c.ch)!==Number(s.ch))out.push(`CH: ${Number(s.ch||0)} → ${Number(c.ch||0)} h/a`);if(c.turn!==undefined&&String(c.turn)!==String(s.turn||''))out.push(`Turno: ${s.turn||'—'} → ${c.turn}`);if(c.notes)out.push(`Justificativa: ${c.notes}`);return out}
function changeSummary(a){const lines=changeLines(a);if(!lines.length)return '<span class="muted">Nenhuma alteração registrada.</span>';return `<div class="change-stack" title="${esc(lines.join(' | '))}">${lines.map(x=>`<div title="${esc(x)}">${esc(x)}</div>`).join('')}</div>`}
let visibleRows=[],selected=new Set();function statusLabel(a){return a.status==='pending'?'Pendente':a.status==='approved'?(String(a.type||'').startsWith('offer_')?'Confirmada pela Direção':'Aprovada'):'Devolvida para correção'}
function canUndoDirector(a){return a.status==='approved'&&['offer_confirm','offer_change','offer_duplicate'].includes(String(a.type||''))&&!a.undoneAt}
function actionLabel(a){if(a.type==='offer_change'&&a.action==='delete')return 'exclusão';if(a.type==='offer_change')return 'alteração';if(a.type==='offer_duplicate')return 'duplicação';if(a.type==='offer_confirm')return 'confirmação';return 'ação'}
function directorMenuHtml(a){
  let items=`<button type="button" data-menu-action="details" data-id="${esc(a.id)}">Ver detalhes</button>`;
  if(canUndoDirector(a)) items=`<button type="button" data-menu-action="undo" data-id="${esc(a.id)}">↶ Desfazer ${esc(actionLabel(a))}</button>`+items;
  if(a.status==='pending') items+=`<button type="button" data-menu-action="correction" data-id="${esc(a.id)}">✕ Devolver para correção</button>`;
  return `<div class="more-menu"><button type="button" class="icon-action more-btn" data-id="${esc(a.id)}" aria-label="Mais opções" title="Mais opções">…</button><div class="more-dropdown">${items}</div></div>`;
}
function offerContext(a){const raw=String(a.targetKey||'').split('|'),matrix=String(raw[0]||''),period=String(raw[1]||''),seq=String(raw[2]||'1'),m=(window._dbData?.data?.matrices||{})[matrix]||{},courses=window._dbData?.data?.courses||[],course=POCV?.courseName?POCV.courseName(courses,matrix):((courses||[]).find(c=>String(c.matrix)===matrix)?.name||a.snapshot?.course||'—'),turn=a.changes?.turn||a.snapshot?.turn||POCV?.turnForClass?.(window._dbData,matrix,period,seq)||'—',codes={1:'4206',2:'4206',3:'0000',4:'0000',5:'4407',6:'4407',7:'4407',8:'4111',9:'4111',10:'4411',11:'4411',12:'4506',13:'4506',14:'4510',15:'4510',16:'4069',17:'4069',18:'4069',19:'4103',20:'4103'},code=codes[matrix]||'0000',ts=String(turn||'').toLowerCase(),tc=ts.includes('manh')?'M':/tard|vesp/.test(ts)?'V':ts.includes('noit')?'N':'X',turma=a.snapshot?.turma||`${period}.${code}.${seq}${tc}`;return {course:course||'—',turn:turn||'—',turma};}
function decisionHtml(a){
  if(a.status==='pending') return `<div class="row-actions"><button class="icon-action validate-offer approve-one" data-id="${a.id}" data-decision="approve" title="Aprovar" aria-label="Aprovar">✓</button>${directorMenuHtml(a)}</div>`;
  if(a.status==='approved') return `<div class="row-actions"><button class="icon-action validate-offer decision-approved" type="button" title="Confirmada pela Direção" aria-label="Confirmada pela Direção">✓</button>${directorMenuHtml(a)}</div>`;
  if(a.status==='correction_requested') return `<div class="row-actions"><button class="icon-action decision-undone" type="button" title="Aguardando nova ação do coordenador" aria-label="Aguardando nova ação do coordenador">↶</button>${directorMenuHtml(a)}</div>`;
  return `<div class="row-actions"><button class="icon-action decision-undone" type="button" title="Ação desfeita" aria-label="Ação desfeita">↶</button>${directorMenuHtml(a)}</div>`;
}
function render(){const st=$('status').value,k=$('kind').value,q=$('q').value.toLowerCase().trim();visibleRows=data.filter(a=>(!st||a.status===st)&&(!k||(k==='offer'?String(a.type).startsWith('offer'):String(a.type).startsWith('extra')))&&(!q||JSON.stringify(a).toLowerCase().includes(q)));$('body').innerHTML=visibleRows.map(a=>{const decision=decisionHtml(a),ctx=offerContext(a),date=new Date(a.createdAt).toLocaleString('pt-BR');return `<tr><td class="select-cell">${a.status==='pending'?`<input class="selectbox pending-select" type="checkbox" data-id="${a.id}" ${selected.has(a.id)?'checked':''}>`:''}</td><td><span class="date-meta">${esc(date)}</span><span class="requester-meta">${esc(a.requesterName||'—')}</span></td><td>${esc(a.semester||'—')}</td><td>${esc(ctx.turma)}</td><td>${esc(ctx.turn)}</td><td>${esc(ctx.course)}</td><td><strong>${esc(text(a))}</strong>${a.changes||a.type==='offer_duplicate'?changeSummary(a):''}</td><td><span class="status ${a.status}">${statusLabel(a)}</span></td><td>${decision}</td></tr>`}).join('')||'<tr><td colspan="9" class="muted" style="padding:30px;text-align:center">Nenhuma pendência encontrada.</td></tr>';syncBatch()}
function syncBatch(){const pendingVisible=visibleRows.filter(a=>a.status==='pending');selected=new Set([...selected].filter(id=>pendingVisible.some(a=>a.id===id)));$('selectedPending').textContent=`${selected.size} selecionada${selected.size===1?'':'s'}`;$('batchbar').classList.toggle('show',pendingVisible.length>0);const all=pendingVisible.length>0&&pendingVisible.every(a=>selected.has(a.id));$('selectAllPending').checked=all;$('selectAllHeader').checked=all}

function showDetails(id){
  const a=data.find(v=>String(v.id)===String(id));
  if(!a)return;
  const raw=String(a.targetKey||'').split('|'), m=(window._dbData?.matrices||{})[raw[0]]||{}, d=m.disciplines?.[Number(String(raw[3]||'').split('::')[0])], courses=window._dbData?.courses||{}, course=POCV?.courseName?POCV.courseName(courses,raw[0]):((Array.isArray(courses)?courses:Object.values(courses||{})).find(c=>String(c.matrix)===String(raw[0]))?.name||a.snapshot?.course||'—');
  const c=a.changes||{},s=a.snapshot||{},ctx=offerContext(a),rows=[];
  if(String(a.type||'').startsWith('offer_')){
    rows.push(['Curso',course]); rows.push(['Semestre',a.semester||'—']); rows.push(['Turma',ctx.turma]); rows.push(['Turno',ctx.turn]);
    rows.push(['Disciplina',d?.name||s.name||'—']);
  }
  if(a.action==='delete')rows.push(['Ação','Excluir oferta']);
  if(c.name!==undefined)rows.push(['Disciplina',`${s.name||d?.name||'—'} → ${c.name}`,'action-change']);
  if(c.group!==undefined)rows.push(['Grupo',`${s.group||'—'} → ${c.group}`,'action-change']);
  if(c.ch!==undefined)rows.push(['Carga horária',`${s.ch??'—'} → ${c.ch}`,'action-change']);
  if(c.turn!==undefined)rows.push(['Turno',`${s.turn||'—'} → ${c.turn}`,'action-change']);
  if(c.notes)rows.push(['Justificativa',c.notes,'wide']);
  if(c.optionalChoices?.length)rows.push(['Optativas selecionadas',c.optionalChoices.join(' + '),'wide']);
  if(a.type==='offer_duplicate')rows.push(['Quantidade total',String(a.duplicate?.quantity||2)]);
  rows.push(['Solicitante',a.requesterName||'—']);
  rows.push(['Data da solicitação',a.createdAt?new Date(a.createdAt).toLocaleString('pt-BR'):'—']);
  $('detailTitle').textContent='Detalhes da pendência';
  $('detailBody').innerHTML=rows.map(r=>`<div class="detail-field ${r[2]||''}"><b>${esc(r[0])}</b><div>${esc(r[1])}</div></div>`).join('')||'<div class="muted detail-empty">Nenhum detalhe adicional.</div>';
  $('detailModal').style.display='flex';
}
$('closeDetail').onclick=()=>$('detailModal').style.display='none';$('detailModal').onclick=e=>{if(e.target===$('detailModal'))$('detailModal').style.display='none'};
async function decide(id,decision){let note='';if(decision==='correction'){note=prompt('Informe ao coordenador o que precisa ser corrigido:','');if(note===null)return false;if(!note.trim()){alert('Informe o que precisa ser corrigido.');return false}}const r=await fetch('/api/validation',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,decision,note})});const j=await r.json();if(!r.ok){alert(j.error||'Erro');return false}selected.delete(id);return true}
async function undoDirectorAction(id){const a=data.find(v=>String(v.id)===String(id));if(!a||!canUndoDirector(a))return false;const label=actionLabel(a);if(!confirm(`Desfazer a ${label} realizada pela Direção? A oferta será restaurada ao estado anterior à ação.`))return false;const r=await fetch('/api/offer/undo-director-action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({semester:a.semester,key:a.targetKey,approvalId:a.id})});const j=await r.json().catch(()=>({}));if(!r.ok){alert(j.error||'Não foi possível desfazer a ação da Direção.');return false}return true}
async function load(){const r=await fetch('/api/validation',{cache:'no-store'});if(!r.ok){$('body').innerHTML='<tr><td colspan="9">Acesso restrito à Direção.</td></tr>';return}const j=await r.json();data=j.approvals||[];try{const dbR=await fetch('/api/db',{cache:'no-store'});window._dbData=dbR.ok?await dbR.json():{};}catch(e){window._dbData={}}render()}
function closeDirectorFloatingMenu(){document.querySelectorAll('.coordinator-floating-menu').forEach(el=>el.remove());}
async function handleDirectorMenuAction(action,id){
  closeDirectorFloatingMenu();
  if(action==='details'){showDetails(id);return;}
  if(action==='undo'){if(await undoDirectorAction(id))await load();return;}
  if(action==='correction'){await decide(id,'correction');await load();return;}
}

document.addEventListener('click',async e=>{const more=e.target.closest('.row-actions .more-btn');if(more){e.preventDefault();e.stopPropagation();const source=more.closest('.more-menu')?.querySelector('.more-dropdown'),id=more.dataset.id||'';closeDirectorFloatingMenu();if(!source||!id)return;const floating=document.createElement('div');floating.className='coordinator-floating-menu';floating.dataset.id=id;floating.innerHTML=source.innerHTML;document.body.appendChild(floating);const rect=more.getBoundingClientRect(),gap=6,margin=8,dw=floating.offsetWidth,dh=floating.offsetHeight;let left=Math.max(margin,Math.min(rect.right-dw,window.innerWidth-dw-margin)),top=rect.bottom+gap;if(top+dh>window.innerHeight-margin)top=rect.top-dh-gap;top=Math.max(margin,Math.min(top,window.innerHeight-dh-margin));floating.style.left=`${Math.round(left)}px`;floating.style.top=`${Math.round(top)}px`;return;}const actionEl=e.target.closest('.coordinator-floating-menu [data-menu-action]');if(actionEl){e.preventDefault();e.stopPropagation();await handleDirectorMenuAction(actionEl.dataset.menuAction,actionEl.dataset.id);return;}const b=e.target.closest('button[data-id][data-decision]');if(!b)return;await decide(b.dataset.id,b.dataset.decision);await load();});
