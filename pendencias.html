<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACHA — Pendências</title><link rel="stylesheet" href="/style.css?v=1.0.77"><script src="/app.js?v=1.0.77"></script><style>.wrap{max-width:1400px;margin:22px auto;padding:0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.head{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.filters{display:grid;grid-template-columns:180px 180px 1fr;gap:10px;padding:14px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.status{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.pending{background:#fff7ed;color:#9a3412}.approved{background:#ecfdf5;color:#166534}.correction_requested{background:#fef2f2;color:#991b1b}.actions{display:flex;gap:6px;flex-wrap:wrap}.batchbar{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#f0fdfa}.batchbar.show{display:flex}.batchbar strong{margin-right:auto;color:#0f766e}.selectbox{width:18px;height:18px}.btn2{padding:7px 10px;border:0;border-radius:8px;font-weight:800;cursor:pointer}.ok{background:#0f766e;color:#fff}.fix{background:#fee2e2;color:#991b1b}.muted{color:#64748b;font-size:12px}.change-summary{margin-top:5px;padding:7px 9px;border-left:3px solid #0f766e;background:#f8fafc;border-radius:6px;font-size:12px;line-height:1.5}.change-summary b{font-weight:800;color:#334155}</style></head><body><nav class="mainnav"></nav><main class="wrap"><section class="card"><div class="head"><div><h1 style="margin:0;font-size:20px">Pendências de validação</h1><div class="muted">Solicitações dos coordenadores aguardando julgamento da Direção.</div></div></div><div class="filters"><select id="status"><option value="">Todos os status</option><option value="pending">Pendentes</option><option value="approved">Aprovadas</option><option value="correction_requested">Solicitada correção</option></select><select id="kind"><option value="">Todos os tipos</option><option value="offer">Ofertas</option><option value="extra">Demandas avulsas</option></select><input id="q" placeholder="Buscar por curso, disciplina ou coordenador..."></div><div id="batchbar" class="batchbar"><input id="selectAllPending" class="selectbox" type="checkbox"><strong id="selectedPending">0 selecionadas</strong><button id="approveSelected" class="btn2 ok" type="button">✓ Aprovar selecionadas</button><button id="clearSelected" class="btn2" type="button">Limpar seleção</button></div><div class="tablewrap"><table class="table"><thead><tr><th class="select-header" style="width:42px;min-width:42px;padding:8px;overflow:visible"><input id="selectAllHeader" class="selectbox" type="checkbox" title="Selecionar todas as pendentes"></th><th>Data</th><th>Solicitante</th><th>Tipo</th><th>Semestre</th><th>Item</th><th>Status</th><th>Decisão</th></tr></thead><tbody id="body"></tbody></table></div></section></main><div id="detailModal" style="display:none;position:fixed;inset:0;background:#0008;z-index:50;align-items:center;justify-content:center"><div style="background:#fff;border-radius:14px;width:min(760px,94vw);max-height:88vh;overflow:auto;padding:22px;box-shadow:0 15px 50px #0005"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 id="detailTitle" style="margin:0">Detalhes da pendência</h2><button id="closeDetail" class="btn2" type="button">✕</button></div><div id="detailBody" style="margin-top:16px"></div></div></div><script>
let data=[];const $=id=>document.getElementById(id),esc=v=>POCV.esc(v);
function label(a){return String(a.type||'').startsWith('offer')?'Oferta':'Demanda avulsa'}
function text(a){if(String(a.type||'').startsWith('offer_')){const raw=String(a.targetKey||'').split('|'),m=(window._dbData?.matrices||{})[raw[0]]||{},d=m.disciplines?.[Number(String(raw[3]||'').split('::')[0])];const course=(window._dbData?.courses||[]).find(c=>String(c.matrix)===String(raw[0]))?.name||a.snapshot?.course||'Oferta';return `${course} · ${d?.name||a.snapshot?.name||'Oferta'}`;}return a.targetLabel||a.proposed?.name||a.snapshot?.name||a.targetKey||'—'}
function changeLines(a){const c=a.changes||{},s=a.snapshot||{},out=[];if(a.action==='delete')out.push('Exclusão da oferta');if(a.type==='offer_duplicate'){out.push(`Duplicidade: ${Math.max(2,Number(a.duplicate?.quantity||2))} ofertas no total`);if(a.changes?.notes)out.push(`Justificativa: ${a.changes.notes}`);return out}if(a.type==='offer_confirm'&&c.optionalChoices?.length)out.push(`Optativa: ${c.optionalChoices.join(' + ')}`);if(c.name!==undefined&&String(c.name)!==String(s.name||''))out.push(`Disciplina: ${s.name||'—'} → ${c.name}`);if(c.group!==undefined&&String(c.group)!==String(s.group||''))out.push(`Grupo: ${s.group||'—'} → ${c.group}`);if(c.ch!==undefined&&Number(c.ch)!==Number(s.ch))out.push(`CH: ${Number(s.ch||0)} → ${Number(c.ch||0)} h/a`);if(c.turn!==undefined&&String(c.turn)!==String(s.turn||''))out.push(`Turno: ${s.turn||'—'} → ${c.turn}`);if(c.notes)out.push(`Justificativa: ${c.notes}`);return out}
function changeSummary(a){const lines=changeLines(a);if(!lines.length)return '<span class="muted">Nenhuma alteração registrada.</span>';return `<div class="change-stack" title="${esc(lines.join(' | '))}">${lines.map(x=>`<div title="${esc(x)}">${esc(x)}</div>`).join('')}</div>`}
let visibleRows=[],selected=new Set();function statusLabel(a){return a.status==='pending'?'Pendente':a.status==='approved'?(String(a.type||'').startsWith('offer_')?'Confirmada pela Direção':'Aprovada'):'Devolvida para correção'}
function render(){const st=$('status').value,k=$('kind').value,q=$('q').value.toLowerCase().trim();visibleRows=data.filter(a=>(!st||a.status===st)&&(!k||(k==='offer'?String(a.type).startsWith('offer'):String(a.type).startsWith('extra')))&&(!q||JSON.stringify(a).toLowerCase().includes(q)));$('body').innerHTML=visibleRows.map(a=>`<tr><td class="select-cell">${a.status==='pending'?`<input class="selectbox pending-select" type="checkbox" data-id="${a.id}" ${selected.has(a.id)?'checked':''}>`:''}</td><td>${new Date(a.createdAt).toLocaleString('pt-BR')}</td><td>${esc(a.requesterName)}</td><td>${label(a)}</td><td>${esc(a.semester)}</td><td><strong>${esc(text(a))}</strong>${a.changes||a.type==='offer_duplicate'?changeSummary(a):''}</td><td><span class="status ${a.status}">${statusLabel(a)}</span></td><td>${a.status==='pending'?`<div class="actions"><button class="icon-approval approve-one" data-id="${a.id}" data-decision="approve" title="Aprovar" aria-label="Aprovar">✓</button><button class="icon-approval deny-one" data-id="${a.id}" data-decision="correction" title="Negar e devolver para correção" aria-label="Negar e devolver para correção">✕</button><button class="btn2 details-one" data-id="${a.id}" type="button">Detalhes</button></div>`:`<div class="muted">${esc(a.decisionNote||'—')}<br>${esc(a.decidedBy||'')}</div>`}</td></tr>`).join('')||'<tr><td colspan="8" class="muted" style="padding:30px;text-align:center">Nenhuma pendência encontrada.</td></tr>';syncBatch()}
function syncBatch(){const pendingVisible=visibleRows.filter(a=>a.status==='pending');selected=new Set([...selected].filter(id=>pendingVisible.some(a=>a.id===id)));$('selectedPending').textContent=`${selected.size} selecionada${selected.size===1?'':'s'}`;$('batchbar').classList.toggle('show',pendingVisible.length>0);const all=pendingVisible.length>0&&pendingVisible.every(a=>selected.has(a.id));$('selectAllPending').checked=all;$('selectAllHeader').checked=all}

function showDetails(id){const a=data.find(v=>String(v.id)===String(id));if(!a)return;const raw=String(a.targetKey||'').split('|'),m=(window._dbData?.matrices||{})[raw[0]]||{},d=m.disciplines?.[Number(String(raw[3]||'').split('::')[0])],course=(window._dbData?.courses||[]).find(c=>String(c.matrix)===String(raw[0]))?.name||a.snapshot?.course||'—';const c=a.changes||{},s=a.snapshot||{};const rows=[];if(String(a.type||'').startsWith('offer_')){rows.push(['Curso',course]);rows.push(['Disciplina',d?.name||s.name||'—']);rows.push(['Semestre',a.semester||'—']);rows.push(['Turma',a.snapshot?.turma||a.targetKey||'—']);}if(a.action==='delete')rows.push(['Ação','Excluir oferta']);if(c.name!==undefined)rows.push(['Disciplina',`${s.name||d?.name||'—'} → ${c.name}`]);if(c.group!==undefined)rows.push(['Grupo',`${s.group||'—'} → ${c.group}`]);if(c.ch!==undefined)rows.push(['Carga horária',`${s.ch??'—'} → ${c.ch}`]);if(c.turn!==undefined)rows.push(['Turno',`${s.turn||'—'} → ${c.turn}`]);if(c.notes)rows.push(['Justificativa',c.notes]);if(c.optionalChoices?.length)rows.push(['Optativas selecionadas',c.optionalChoices.join(' + ')]);if(a.type==='offer_duplicate')rows.push(['Quantidade total',String(a.duplicate?.quantity||2)]);$('detailTitle').textContent='Detalhes da pendência';$('detailBody').innerHTML=`<div style="display:grid;gap:10px">${rows.map(r=>`<div style="padding:10px 12px;background:#f8fafc;border-radius:8px"><b>${esc(r[0])}</b><div style="margin-top:3px">${esc(r[1])}</div></div>`).join('')||'<div class="muted">Nenhum detalhe adicional.</div>'}</div>`;$('detailModal').style.display='flex'}
$('closeDetail').onclick=()=>$('detailModal').style.display='none';$('detailModal').onclick=e=>{if(e.target===$('detailModal'))$('detailModal').style.display='none'};
async function decide(id,decision){let note='';if(decision==='correction'){note=prompt('Informe ao coordenador o que precisa ser corrigido:','');if(note===null)return false;if(!note.trim()){alert('Informe o que precisa ser corrigido.');return false}}const r=await fetch('/api/validation',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,decision,note})});const j=await r.json();if(!r.ok){alert(j.error||'Erro');return false}selected.delete(id);return true}
async function load(){const r=await fetch('/api/validation',{cache:'no-store'});if(!r.ok){$('body').innerHTML='<tr><td colspan="8">Acesso restrito à Direção.</td></tr>';return}const j=await r.json();data=j.approvals||[];try{const dbR=await fetch('/api/db',{cache:'no-store'});window._dbData=dbR.ok?await dbR.json():{};}catch(e){window._dbData={}}render()}
['status','kind'].forEach(id=>$(id).onchange=()=>{selected.clear();render()});$('q').oninput=()=>{selected.clear();render()};$('body').onclick=async e=>{const detail=e.target.closest('.details-one');if(detail){showDetails(detail.dataset.id);return;}const b=e.target.closest('button[data-id]');if(!b)return;await decide(b.dataset.id,b.dataset.decision);await load()};$('body').addEventListener('change',e=>{if(e.target.matches('.pending-select')){if(e.target.checked)selected.add(e.target.dataset.id);else selected.delete(e.target.dataset.id);syncBatch()}});$('selectAllPending').onchange=()=>{const pending=visibleRows.filter(a=>a.status==='pending');if($('selectAllPending').checked)pending.forEach(a=>selected.add(a.id));else pending.forEach(a=>selected.delete(a.id));render()};$('selectAllHeader').onchange=()=>{$('selectAllPending').checked=$('selectAllHeader').checked;$('selectAllPending').onchange()};$('clearSelected').onclick=()=>{selected.clear();render()};$('approveSelected').onclick=async()=>{const ids=[...selected].filter(id=>visibleRows.some(a=>a.id===id&&a.status==='pending'));if(!ids.length)return alert('Selecione ao menos uma pendência.');if(!confirm(`Aprovar ${ids.length} pendência${ids.length===1?'':'s'} selecionada${ids.length===1?'':'s'}?`))return;for(const id of ids){if(!await decide(id,'approve'))break}selected.clear();await load()};load();
</script></body></html>
