services:
  acha:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acha
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acha}
      # db.json é empacotado na imagem e usado apenas na migração inicial.
      DB_FILE: /app/data/db.json
      MIGRATION_MODE: initial
    networks:
      - database_network
      - proxy_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  database_network:
    external: true
  proxy_network:
    external: true
