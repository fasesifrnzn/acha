services:
  acha:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_FILE: /var/data/db.json
    volumes:
      - acha_data:/var/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
    networks:
      - database_network
      - proxy_network
  acha_data:
    name: acha_data

networks:
  database_network:
    external: true
  proxy_network:
    external: true
