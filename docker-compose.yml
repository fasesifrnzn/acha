services:
  acha:
    build:
      context: .
      dockerfile: Dockerfile
    image: acha:1.0.105
    container_name: acha
    restart: unless-stopped
    ports:
      - "5002:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acha}
      DB_FILE: /app/data/db.json
      MIGRATION_MODE: initial
    volumes:
      - ./data:/app/data:ro
    networks:
      - database_network
      - proxy_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  database_network:
    external: true
  proxy_network:
    external: true
