<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACHA | Gerenciamento de acesso</title><link rel="stylesheet" href="/style.css?v=1.0.48"><script src="/app.js?v=1.0.48"></script><style>.access-wrap{max-width:1180px;margin:0 auto}.access-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 2px 8px #00000008;margin-bottom:16px}.access-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}.access-head h1{margin:0 0 6px}.access-head p{margin:0;color:var(--muted)}.profile-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.profile-tab{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;cursor:pointer}.profile-tab.active{background:var(--accent,#0f766e);color:#fff;border-color:var(--accent,#0f766e)}.access-grid{display:grid;grid-template-columns:minmax(0,1fr) 180px 180px;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}.access-row{display:contents}.access-grid>div{padding:10px 12px;border-bottom:1px solid var(--line)}.access-grid>div:nth-last-child(-n+3){border-bottom:0}.access-grid .hd{font-weight:800;background:#f8fafc}.access-grid select{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff}.access-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:600px}.access-controls label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}.access-controls select{padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}.access-feature{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.access-feature label{display:flex;gap:9px;align-items:center}.access-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.access-status{font-size:13px;color:var(--muted);margin-top:10px}.danger-note{font-size:12px;color:#991b1b;margin-top:8px}@media(max-width:700px){.access-grid{grid-template-columns:minmax(0,1fr) 125px 125px;font-size:13px}.access-controls{grid-template-columns:1fr}.access-grid{overflow:auto}}</style></head><body><nav class="mainnav"></nav><main class="access-wrap"><section class="access-card"><div class="access-head"><div><h1>Gerenciamento de acesso</h1><p>Defina, por perfil, quais páginas podem ser visualizadas ou editadas e qual intervalo de semestres fica disponível.</p></div></div><div id="tabs" class="profile-tabs"></div><div class="access-controls"><label>Semestre inicial<select id="semesterFrom"></select></label><label>Semestre final<select id="semesterTo"></select></label></div><div class="access-feature"><label><input type="checkbox" id="offerForecast"> Permitir o quadro <strong>Previsão de carga-horária</strong> dentro de Oferta</label><div class="danger-note">Para Coordenador de Curso, o padrão é desativado.</div></div></section><section class="access-card"><h2 style="margin-top:0">Permissões por página</h2><div class="access-grid" id="grid"><div class="hd">Página</div><div class="hd">Permissão</div><div class="hd">Nível</div></div><div class="access-actions"><button class="btn btn-primary" id="save" type="button">Salvar configurações</button></div><div class="access-status" id="status"></div></section></main><script>(function(){let state=null,role='coordenador_curso';const $=id=>document.getElementById(id);const pagesLabel={};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}function semesterOptions(){const arr=[];for(let y=2024;y<=2035;y++)for(let s=1;s<=2;s++)arr.push(`${y}.${s}`);return arr;}function render(){const p=state.access.profiles[role],tabs=$('tabs');tabs.innerHTML=Object.entries(state.access.profiles).map(([r,v])=>`<button type="button" class="profile-tab ${r===role?'active':''}" data-role="${r}">${esc(v.label)}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{role=b.dataset.role;render();});const opts=semesterOptions();$('semesterFrom').innerHTML=opts.map(v=>`<option>${v}</option>`).join('');$('semesterTo').innerHTML=opts.map(v=>`<option>${v}</option>`).join('');$('semesterFrom').value=p.semesterFrom;$('semesterTo').value=p.semesterTo;$('offerForecast').checked=p.features?.['oferta.previsao']!==false;const grid=$('grid');grid.innerHTML='<div class="hd">Página</div><div class="hd">Permissão</div><div class="hd">Nível</div>'+state.catalog.map(([page,label])=>{const val=p.pages?.[page]||'none';return `<div><strong>${esc(label)}</strong><div style="color:var(--muted);font-size:12px">${esc(page)}</div></div><div>${val==='none'?'Bloqueada':val==='view'?'Visualização':'Edição'}</div><div><select data-page="${esc(page)}"><option value="none">Sem acesso</option><option value="view">Visualização</option><option value="edit">Edição</option></select></div>`}).join('');grid.querySelectorAll('select').forEach(s=>s.value=p.pages[s.dataset.page]||'none');}async function load(){const r=await fetch('/api/access',{cache:'no-store'});if(!r.ok){$('status').textContent='Acesso restrito à Direção.';return;}state=await r.json();render();}$('save').onclick=async()=>{const p=state.access.profiles[role],pages={};$('grid').querySelectorAll('select[data-page]').forEach(s=>pages[s.dataset.page]=s.value);const from=$('semesterFrom').value,to=$('semesterTo').value;if(from>to){$('status').textContent='O semestre inicial não pode ser posterior ao final.';return;}const r=await fetch('/api/access',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({role,pages,semesterFrom:from,semesterTo:to,features:{'oferta.previsao':$('offerForecast').checked}})});const j=await r.json();if(!r.ok){$('status').textContent=j.error||'Não foi possível salvar.';return;}state.access=j.access;$('status').textContent='Configurações salvas com sucesso.';render();};load();})();</script></body></html>
